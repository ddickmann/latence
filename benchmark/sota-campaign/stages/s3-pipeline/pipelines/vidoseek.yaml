# s3-vidoseek — generated by the s3-pipeline campaign stage. DO NOT hand-tune on
# the pod: regenerate via `latence-campaign run s3-pipeline` so campaign.yaml stays
# the single source of truth (identical s3 config => byte-identical file).
# chunk 640/80/8 | fused_entity_relation.gliner2 (fastino/gliner2-multi-v1) @ 0.5 | induction per_chunk (deepseek/deepseek-v4-flash-0731, reasoning off, max 2677 calls)
# redaction redaction.gliner2 guardrails=on | extract_on unmasked (extraction reads raw chunks; masking applies to the exported corpus)
schema_version: 2
name: s3-vidoseek
storage_uri: file:///workspace/latence-sota/s3/vidoseek
extract_on: unmasked
stages:
- name: source
  capability: source
  provider: source.local_folder
  config:
    path: file:///workspace/latence-sota/s3/input/vidoseek/markdown
    sensitivity: internal
    extensions:
    - md
    - markdown
- name: intake_screen
  capability: intake_screening
  provider: screening.intake_signature
  depends_on:
  - source
  config:
    max_bytes: 26214400
    max_zip_ratio: 100.0
- name: parse
  capability: parse
  provider: parser.plaintext
  depends_on:
  - intake_screen
- name: chunk
  capability: chunk
  provider: chunk.markdown
  depends_on:
  - parse
  config:
    max_tokens: 640
    overlap_tokens: 80
    min_tokens: 8
- name: content_screen
  capability: content_screening
  provider: screening.content_keyword
  depends_on:
  - chunk
- name: induce
  capability: schema_induction
  provider: label_inducer.llm
  depends_on:
  - content_screen
  config:
    model: deepseek/deepseek-v4-flash-0731
    base_url: https://openrouter.ai/api/v1
    granularity: chunk
    max_tokens: 2048
    max_labels: 40
    temperature: 0.0
    max_induction_calls: 2677
    max_concurrency: 32
    device: cuda
    reasoning: false
- name: extract
  capability: fused_entity_relation
  provider: fused_entity_relation.gliner2
  depends_on:
  - induce
  config:
    model: fastino/gliner2-multi-v1
    labels:
    - person
    - organization
    relation_labels:
    - works_for
    threshold: 0.5
    device: cuda
- name: redact
  capability: redaction
  provider: redaction.gliner2
  depends_on:
  - induce
  config:
    pii_labels:
    - person
    - email
    - phone number
    - address
    - credit card number
    - social security number
    guardrails: true
    device: cuda
- name: profiling
  capability: profiling
  provider: profiling.statistical
  depends_on:
  - parse
  - extract
- name: consolidate_types
  capability: type_consolidation
  provider: type_consolidation.exact_surface
  depends_on:
  - extract
- name: disambiguate
  capability: disambiguation
  provider: disambiguation.exact_surface
  depends_on:
  - consolidate_types
- name: graph
  capability: graph_assembly
  provider: graph.canonical
  depends_on:
  - disambiguate
  config:
    corpus_id: s3-vidoseek
    hyperedges:
      weak_hyperedges: true
      max_arity: 12
      min_tokens: 25
      max_tokens: 180
      max_window_sentences: 3
    graph_features:
      provider: graph_features.degree
- name: enrich
  capability: context_enrichment
  provider: context.kg_header
  depends_on:
  - redact
  - graph
  config:
    max_neighbors_per_entity: 4
    max_triples: 6
- name: export_kg
  capability: export
  provider: export.knowledge_graph
  depends_on:
  - graph
  config:
    basename: graph
    hyperedge_kv: true
- name: export_corpus
  capability: export
  provider: export.jsonl_parquet
  depends_on:
  - enrich
  config:
    basename: corpus
    context_columns: true
    # Benchmark corpus: PII spans stay recorded in pii_spans/masked_content, but the
    # exported+embedded text is the RAW content. Measured 2026-08-07: with masking on,
    # 82% of 2Wiki/MultiHop-RAG rows carried [PERSON]-style placeholders INCLUDING the
    # article titles the questions target, and the reused M6 musique/hotpot exports are
    # unmasked -- so retrieval numbers were neither valid nor cross-comparable.
    unsafe_unmasked_corpus: true
    embedder:
      provider: embedding.sentence_transformers
      config:
        model: ibm-granite/granite-embedding-311m-multilingual-r2
        dimension: 768
        device: cuda
    bm25:
      provider: tokenizer.regex
