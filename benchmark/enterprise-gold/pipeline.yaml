            - Braxis hydraulic pump
            - Nadir 12 sensor array
            - Pyrand-Dämmplatte
            - Larent handling arm
            - Ambrel dosing kit
            - Kestrel-Profil
            - Vaskal-Konzentrat
        LOCATION:
          terms:
            - Düsseldorf
            - Bratislava
            - Trondheim
            - Porto
            - Lyon
            - Kattowitz
            - Tampere
            - Genoa
            - Rotterdam
            - Leipzig
            - Leeds
            - Coventry
            - Mannheim
            - Jena
            - Heidelberg
            - Aberdeen
            - Hamburg
            - Duisburg
            - Bielefeld
            - Utrecht
            - London
            - Bremen
            - Eindhoven
            - Boston
            - Zürich

  # Trigger phrases are the corpus's own phrasing (EN + DE). relation.pattern requires the
  # trigger to sit BETWEEN a head-typed and a later tail-typed mention within window_chars.
  - name: relations
    capability: relation_extraction
    provider: relation.pattern
    depends_on: [redact, entities]
    config:
      window_chars: 200
      relations:
        acquired:
          head: ORG
          tail: ORG
          triggers: [acquired, übernahm, hat übernommen]
        supplies:
          head: ORG
          tail: ORG
          triggers: [supplies, beliefert, liefert an]
        merged_with:
          head: ORG
          tail: ORG
          symmetric: true
          triggers: [merged with, fusionierte mit]
        invested_in:
          head: ORG
          tail: ORG
          triggers: [invested in, beteiligte sich an]
        partner_of:
          head: ORG
          tail: ORG
          symmetric: true
          triggers: [partnered with, partner of, kooperiert mit]
        works_for:
          head: PERSON
          tail: ORG
          triggers: [works at, joined, employed by, arbeitet bei, wechselte zu, leitet]
        manufactures:
          head: ORG
          tail: PRODUCT
          triggers: [manufactures, produces, fertigt, produziert]
        located_in:
          head: ORG
          tail: LOCATION
          triggers: [is headquartered in, is based in, hat ihren Sitz in, mit Sitz in]

  - name: disambiguate
    capability: disambiguation
    provider: disambiguation.cascade
    depends_on: [entities, relations]

  - name: graph
    capability: graph_assembly
    provider: graph.canonical
    depends_on: [disambiguate]
    config:
      corpus_id: enterprise-gold
      hyperedges:
        min_tokens: 12
        max_window_sentences: 2

  - name: export_kg
    capability: export
    provider: export.knowledge_graph
    depends_on: [graph]
    config:
      basename: graph

  - name: export_corpus
    capability: export
    provider: export.jsonl_parquet
    depends_on: [redact]
    config:
      basename: records
