# enterprise-gold — the hypergraph supporting-fact eval stack (tickets 08 / 17 / 21).
#
# Shape: the e2e template from packages/latence-core/tests/test_hyperedge.py
# (source -> parse -> chunk -> redact -> entities -> relations -> disambiguate ->
# graph_assembly[hyperedges] -> export) plus the ticket-17 corpus export wired the way
# packages/latence-core/tests/test_e2e_graph.py wires `export.jsonl_parquet`.
#
# `${REPO_ROOT}` is substituted with the repository root by run_pipeline.py before the
# text reaches `Pipeline.from_yaml_text` (core has no env expansion of its own), so this
# file stays machine-independent. Run it with:
#
#     PYTHONHASHSEED=0 uv run python benchmark/enterprise-gold/run_pipeline.py
#
# The corpus export basename MUST stay `records`: `latence-label` looks for
# records.jsonl / records.parquet inside an export dir (labeling/goldset._find_export_file).
name: enterprise-gold
storage_uri: file://${REPO_ROOT}/benchmark/enterprise-gold/store
stages:
  - name: source
    capability: source
    provider: source.local_folder
    config:
      path: 'file://${REPO_ROOT}/benchmark/enterprise-gold/corpus'
      sensitivity: internal
      extensions: [txt, md]

  - name: parse
    capability: parse
    provider: parser.plaintext
    depends_on: [source]

  # No chunk overlap: a supporting-fact span must have exactly one home chunk, so the
  # gold offsets are unambiguous (a fact never crosses a chunk boundary by design).
  - name: chunk
    capability: chunk
    provider: chunk.markdown
    depends_on: [parse]
    config:
      max_tokens: 90
      overlap_tokens: 0
      min_tokens: 8

  # W16/ADR-0042: Redaction is a chunk->chunk transform. The corpus Export downstream of
  # it materializes `masked_content`, which IS the corpus text the gold offsets index
  # (labeling/goldset._row_to_chunk) — so the planted invented emails/phones are masked
  # before anyone labels or evaluates against them.
  - name: redact
    capability: redaction
    provider: redaction.hybrid_rule
    depends_on: [chunk]

  - name: entities
    capability: entity_extraction
    provider: entity.gazetteer
    depends_on: [redact]
    config:
      labels:
        ORG:
          terms:
            - Meridian Systems AG
            - Norvik Tools GmbH
            - Kalthoff AG
            - Brekker Antriebstechnik GmbH
            - Ardent Vale Ltd
            - Brightmoor Analytics Ltd
            - Solvex Chemie GmbH
            - Tessaro Logistik AG
            - Halcyon Verpackung GmbH
            - Pelmar Robotics SA
            - Quintara Energy plc
            - Vantor Stahlwerke AG
            - Ferrix Automation BV
            - Wendlin Pharma AG
            - Oakhurst Capital Partners
            - Cendria Software Ltd
            - Lorquin Metals SpA
            - Aurenta Insurance Group
            - Dalgren Maritime AS
            - Zephyrine Labs GmbH
            - Tolmach Bergbau AG
            - Nyquist Sensors Oy
            - Ravenport Terminals Ltd
            - Ellsworth Diagnostics Inc
            - Marnix Textil BV
        PERSON:
          terms:
            - Ilse Brandtner
            - Henrik Vosskamp
            - Marta Cendrillo
            - Tobias Reinhard
            - Adaeze Okonkwo
            - Sven Lidbergh
            - Renata Falkner
            - Jonas Petric
            - Camille Aubertin
            - Miriam Straub
            - Yusuf Kandemir
            - Elena Marchetti
            - Piotr Zawadzki
            - Hannah Loewe
            - Gregor Malin
            - Sofia Andrade
            - Nils Ekstrand
            - Beatrix Homann
            - Dario Vespucci
            - Fatima Zerhouni
        PRODUCT:
          terms:
            - Tarnex-Getriebe
            - Tarnex gearbox
            - Vortan 400 Servoantrieb
            - Vortan 400 servo drive
            - Halox membrane
            - Corvid X2 controller
            - Selenta-Beschichtung
