# stacks/gpu-ocr.yaml — the scanned-document (OCR-first) stack (W1-lighton, #91).
#
# The one thing the CPU text-layer parsers cannot do: read a SCANNED / image-only page (no text
# layer). stacks/default.yaml and stacks/gpu-sota.yaml parse with `parser.pdfplumber` (text layer);
# this stack swaps the Parse Stage for `parser.lighton` — the real GPU LightOn-OCR image->markdown
# Parser (reads pixels) — so a corpus of scans/photos becomes AI-ready markdown. Everything
# downstream of Parse is the deterministic in-core CPU spine (Chunk -> Content Screening -> RAG
# Export), so on a GPU host with latence-parser-lighton installed the WHOLE spine runs; the only
# GPU-gated node is Parse.
#
# DEVICE HONESTY (P3-F1 / the G1 skip-with-flag posture, #64). Parse pins `device: cuda` and its
# Provider ships in a SEPARATE heavy package (ADR-0016) NOT in the CPU-only dev/CI env. On a
# CPU-only host `latence stack validate stacks/gpu-ocr.yaml`:
#   * reports Parse (and every stage that depends on it) as **skipped-with-flag** — not installed /
#     no CUDA — NEVER faked, never a fabricated quality/throughput number;
#   * still validates the CPU-reachable head (Source -> Intake Screening) end-to-end, so the stack
#     is proven as far as this host allows and its contracts/report checks pass.
# On a real GPU host with the heavy package installed, Parse runs (device: cuda) and the full
# Source -> Intake -> Parse -> Chunk -> Content Screening -> RAG-corpus Export spine validates over
# the scanned corpus.
#
# stacks/<client>.yaml is the documented extension point: copy this stack and point `source.config.
# path` at your scan corpus (PDF scans, PNG/JPEG/TIFF photos of documents).
name: latence-gpu-ocr-stack
storage_uri: "{STORAGE_URI}"
stages:
  - name: source
    capability: source
    provider: source.local_folder
    config:
      path: "{CORPUS_DIR}"
      sensitivity: internal
      extensions: [pdf, png, jpg, jpeg, tiff, tif, webp, bmp]

  - name: intake_screen
    capability: intake_screening
    provider: screening.intake_signature
    depends_on: [source]
    config:
      max_bytes: 8388608          # scans/photos are larger than text PDFs (8 MiB)
      max_zip_ratio: 50.0

  # --- The OCR Parser: GPU-gated, skipped-with-flag on a CPU-only host (device: cuda) ---
  - name: parse
    capability: parse
    provider: parser.lighton      # real GPU LightOn-OCR image->markdown (latence-parser-lighton)
    depends_on: [intake_screen]
    config:
      device: cuda                # honest GPU intent; skipped-with-flag where no CUDA (P3-F1)
      dpi: 200                    # PDF->image rasterisation DPI (higher = sharper, slower)

  - name: chunk
    capability: chunk
    provider: chunk.markdown
    depends_on: [parse]
    config: {max_tokens: 256, overlap_tokens: 32, min_tokens: 8}

  - name: content_screen
    capability: content_screening
    provider: screening.content_keyword
    depends_on: [chunk]

  - name: export_corpus
    capability: export
    provider: export.jsonl_parquet
    depends_on: [content_screen]
    config:
      basename: corpus
