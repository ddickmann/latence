# stacks/graph-features.yaml — the blessed default spine PLUS the OPTIONAL ADR-0051 graph-feature
# enrichment (centrality + community) on Graph Assembly, so `latence stack validate` exercises the
# index-time graph-feature signal end-to-end (#161).
#
# Two additions over the default spine, both genuinely optional (default.yaml declares neither, so a
# stack without them is byte-identical — the ADR-0051 guarantee):
#   1. the `graph` Stage names a `graph_features` computer (`graph_features.degree`) — the assembler
#      resolves it (as Export resolves its Embedder) and stamps `centrality` + `community` onto every
#      node's `properties`, which `export_kg` promotes to first-class graph-nodes.parquet columns; and
#   2. an `enrich` Stage (`context.kg_header`) projects those per-node features onto each chunk's
#      context_header (kg_node_centrality / kg_node_community), aligned with the chunk's entities.
#
# W16 (ADR-0042): `enrich` reads the REDACTED chunk stream (redact → enrich → export_corpus), so the
# exported corpus is masked (PII-safe — the stack-validate rag-scan passes) AND carries the enriched
# header. The features are deterministic (fixed iteration order, rounded scores, content-addressed
# community ids), so stack-validate's determinism + resume checks compare the graph-nodes.parquet
# columns + the context_header byte-for-byte across runs. Every other Stage is byte-identical to
# default.yaml.
name: latence-graph-features-stack
storage_uri: "{STORAGE_URI}"
stages:
  - name: source
    capability: source
    provider: source.local_folder
    config:
      path: "{CORPUS_DIR}"
      sensitivity: internal
      extensions: [txt, md, markdown, pdf, zip]

  - name: intake_screen
    capability: intake_screening
    provider: screening.intake_signature
    depends_on: [source]
    config:
      max_bytes: 2097152
      max_zip_ratio: 50.0

  - name: parse
    capability: parse
    provider: parser.pdfplumber
    depends_on: [intake_screen]

  - name: chunk
    capability: chunk
    provider: chunk.markdown
    depends_on: [parse]
    config: {max_tokens: 256, overlap_tokens: 32, min_tokens: 8}

  - name: content_screen
    capability: content_screening
    provider: screening.content_keyword
    depends_on: [chunk]

  - name: entities
    capability: entity_extraction
    provider: entity.gazetteer
    depends_on: [content_screen]
    config:
      labels:
        ORG:
          terms: [Acme, Acme Corporation, International Business Machines, IBM, Globex]
        PERSON:
          terms: [Alice, Bob, Carol]

  - name: relations
    capability: relation_extraction
    provider: relation.pattern
    depends_on: [content_screen, entities]
    config:
      window_chars: 200
      relations:
        works_for: {head: PERSON, tail: ORG, triggers: [works at, employed by, joined]}
        partner_of: {head: ORG, tail: ORG, triggers: [partner of, partnered with]}

  - name: redact
    capability: redaction
    provider: redaction.hybrid_rule
    depends_on: [content_screen]

  - name: profiling
    capability: profiling
    provider: profiling.statistical
    depends_on: [parse, entities]

  - name: disambiguate
    capability: disambiguation
    provider: disambiguation.cascade
    depends_on: [entities, relations]
    config:
      kb:
        - {kb_id: Q1, name: Acme, entity_type: ORG}
        - {kb_id: Q2, name: International Business Machines, entity_type: ORG, aliases: [IBM]}
      kb_threshold: 0.5

  # The Graph-Assembly Stage with the OPTIONAL graph-feature enrichment wired (ADR-0051): the
  # assembler resolves the `graph_features.degree` computer and stamps centrality + community onto
  # every node's `properties` — which export_kg promotes to graph-nodes.parquet columns.
  - name: graph
    capability: graph_assembly
    provider: graph.canonical
    depends_on: [disambiguate]
    config:
      corpus_id: latence-graph-features-stack
      graph_features:
        provider: graph_features.degree
        config: {}

  # Project the per-node features onto each chunk's context_header (kg_node_centrality /
  # kg_node_community), aligned with the chunk's own entities.
  - name: enrich
    capability: context_enrichment
    provider: context.kg_header
    depends_on: [redact, graph]
    config:
      max_neighbors_per_entity: 4
      max_triples: 6

  - name: export_kg
    capability: export
    provider: export.knowledge_graph
    depends_on: [graph]
    config: {basename: graph}

  - name: export_corpus
    capability: export
    provider: export.jsonl_parquet
    depends_on: [enrich]
    config: {basename: corpus}
