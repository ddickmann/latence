# stacks/gpu-sota-pod.yaml — the SELF-CONTAINED GPU-pod variant of stacks/gpu-sota.yaml.
#
# Identical to stacks/gpu-sota.yaml (same fused Entity+Relation Stage, same learned Redaction,
# same Disambiguation → Graph Assembly → KG Export spine) with ONE difference: the RAG-corpus
# Export embedder is the IN-PROCESS `embedding.sentence_transformers` Provider instead of the
# served `embedding.endpoint`.
#
# WHY A SEPARATE POD VARIANT. The blessed gpu-sota.yaml keeps `embedding.endpoint` for the corpus
# export because the *served* embedding story (a running inference host the corpus export calls) is
# the production narrative — but it needs that host to be up. This variant swaps it for the
# in-process sentence-transformers embedder (`intfloat/multilingual-e5-small`, MIT), so the WHOLE
# stack runs out of the box on a single GPU pod with NO external service to stand up first. This is
# the stack the maintainer runs on a GPU pod to validate the fused SOTA path end-to-end:
#
#   LATENCE_CUDA=1 latence stack validate stacks/gpu-sota-pod.yaml
#
# Pod-validated (RTX 2000 Ada, all learned Providers real): PASS — documents=3; contracts 28/28
# prov+class, offsets aligned, drift clean; kg nodes=3 edges=18 evidence_coverage=1.00; rag 3 rows,
# no PII leak; report schema v18, 12 stage metrics; graceful_failure 3 quarantined + 1 PARSE_ERROR;
# determinism 6 artifacts byte-identical across two runs; resume byte-identical.
#
# DEVICE HONESTY (P3-F1). Every learned/in-process-GPU Stage pins `device: cuda` and ships in a
# SEPARATE heavy package (ADR-0016) NOT in the CPU-only dev/CI env. On a CPU-only host
# `latence stack validate stacks/gpu-sota-pod.yaml` reports these Stages skipped-with-flag (never
# faked), validates the CPU-reachable spine, and exits 0. The CPU capability-satisfaction guard
# test (test_stack_capability_guard.py) still checks the fused/standalone wiring even though the
# stages are device-skipped at run.
name: latence-gpu-sota-pod-stack
storage_uri: "{STORAGE_URI}"
stages:
  - name: source
    capability: source
    provider: source.local_folder
    config:
      path: "{CORPUS_DIR}"
      sensitivity: internal
      extensions: [txt, md, markdown, pdf, zip]

  - name: intake_screen
    capability: intake_screening
    provider: screening.intake_signature
    depends_on: [source]
    config:
      max_bytes: 2097152
      max_zip_ratio: 50.0

  - name: parse
    capability: parse
    provider: parser.pdfplumber
    depends_on: [intake_screen]

  - name: chunk
    capability: chunk
    provider: chunk.markdown
    depends_on: [parse]
    config: {max_tokens: 256, overlap_tokens: 32, min_tokens: 8}

  - name: content_screen
    capability: content_screening
    provider: screening.content_keyword
    depends_on: [chunk]

  # --- ONE fused Entity+Relation Stage (ADR-0013): `relation.gliner_relex` does joint NER+RE in
  # one pass via `extract_fused`, satisfying `FusedEntityRelationExtractor`. The Runner routes its
  # FusedExtraction (mentions + relations) to BOTH downstream consumers with no separate Entity
  # Stage (no double-NER, no RelationExtractor-seam ContractError). Skipped-with-flag on a CPU host.
  - name: extract
    capability: fused_entity_relation
    provider: relation.gliner_relex
    depends_on: [content_screen]
    config:
      device: cuda
      labels: [organization, person]
      relation_labels: [works for, partner of]
      threshold: 0.3

  - name: redact
    capability: redaction
    provider: redaction.gliner_pii
    depends_on: [parse]
    config:
      device: cuda
      pii_labels: [person, email, phone number, address, credit card number, social security number]

  - name: profiling
    capability: profiling
    provider: profiling.statistical
    depends_on: [parse, extract]

  - name: disambiguate
    capability: disambiguation
    provider: disambiguation.embedding
    depends_on: [extract]
    config:
      threshold: 0.90
      context_window: 160
      embedder:
        provider: embedding.sentence_transformers
        config: {model: intfloat/multilingual-e5-small, dimension: 384, device: cuda}
      kb:
        - {kb_id: Q1, name: Acme, entity_type: organization}
        - {kb_id: Q2, name: International Business Machines, entity_type: organization, aliases: [IBM]}
      kb_threshold: 0.5

  - name: graph
    capability: graph_assembly
    provider: graph.canonical
    depends_on: [disambiguate]
    config: {corpus_id: latence-gpu-sota-pod-stack}

  - name: export_kg
    capability: export
    provider: export.knowledge_graph
    depends_on: [graph]
    config: {basename: graph}

  # The ONE difference from gpu-sota.yaml: the RAG-corpus embedder is the IN-PROCESS
  # sentence-transformers Provider (no served endpoint to stand up first) — the self-contained
  # pod story. `intfloat/multilingual-e5-small` (MIT), dimension 384, device: cuda.
  - name: export_corpus
    capability: export
    provider: export.jsonl_parquet
    depends_on: [redact]
    config:
      basename: corpus
      embedder:
        provider: embedding.sentence_transformers
        config: {model: intfloat/multilingual-e5-small, dimension: 384, device: cuda}
