# stacks/retrieval-signals.yaml — the blessed default spine PLUS the OPTIONAL index-time
# retrieval-signal generators on the RAG corpus Export, so `latence stack validate` exercises the
# sparse / multi-vector / FDE emission end-to-end (#160, ADR-0049/0050/0053).
#
# The blessed default spine (stacks/default.yaml) is byte-identical here, with ONE change: the
# `export_corpus` Stage additionally wires the three in-core REFERENCE signal generators — a
# deterministic SparseEmbedder (`sparse.hashing` → parallel sparse_indices/sparse_values columns), a
# MultiVectorEmbedder (`multivector.hashing`) feeding an FdeConverter (`fde.reference` → the
# fde_embedding dense column) and, with keep_multivectors, the raw multi-vector sidecar
# (multivectors.parquet). These are references that exercise the seam + emission offline, NOT the
# blessed SPLADE/MUVERA models (those are the pluggable packages in tickets #04/#05).
#
# Because the Export depends on `redact` (as in default.yaml), every signal is generated over the
# REDACTED corpus text (masked_content), so the sparse/dense/multi-vector signals never re-leak the
# PII the corpus removed (ADR-0053) — the stack-validate rag-scan proves no raw PII in any artifact,
# including the new columns + the sidecar. The signals are additive + deterministic, so
# stack-validate's determinism + resume checks compare the emitted signal columns/sidecar
# byte-for-byte across runs. Every non-Export Stage is byte-identical to default.yaml.
name: latence-retrieval-signals-stack
storage_uri: "{STORAGE_URI}"
stages:
  - name: source
    capability: source
    provider: source.local_folder
    config:
      path: "{CORPUS_DIR}"
      sensitivity: internal
      extensions: [txt, md, markdown, pdf, zip]

  - name: intake_screen
    capability: intake_screening
    provider: screening.intake_signature
    depends_on: [source]
    config:
      max_bytes: 2097152
      max_zip_ratio: 50.0

  - name: parse
    capability: parse
    provider: parser.pdfplumber
    depends_on: [intake_screen]

  - name: chunk
    capability: chunk
    provider: chunk.markdown
    depends_on: [parse]
    config: {max_tokens: 256, overlap_tokens: 32, min_tokens: 8}

  - name: content_screen
    capability: content_screening
    provider: screening.content_keyword
    depends_on: [chunk]

  - name: entities
    capability: entity_extraction
    provider: entity.gazetteer
    depends_on: [content_screen]
    config:
      labels:
        ORG:
          terms: [Acme, Acme Corporation, International Business Machines, IBM, Globex]
        PERSON:
          terms: [Alice, Bob, Carol]

  - name: relations
    capability: relation_extraction
    provider: relation.pattern
    depends_on: [content_screen, entities]
    config:
      window_chars: 200
      relations:
        works_for: {head: PERSON, tail: ORG, triggers: [works at, employed by, joined]}
        partner_of: {head: ORG, tail: ORG, triggers: [partner of, partnered with]}

  - name: redact
    capability: redaction
    provider: redaction.hybrid_rule
    depends_on: [content_screen]

  - name: profiling
    capability: profiling
    provider: profiling.statistical
    depends_on: [parse, entities]

  - name: disambiguate
    capability: disambiguation
    provider: disambiguation.cascade
    depends_on: [entities, relations]
    config:
      kb:
        - {kb_id: Q1, name: Acme, entity_type: ORG}
        - {kb_id: Q2, name: International Business Machines, entity_type: ORG, aliases: [IBM]}
      kb_threshold: 0.5

  - name: graph
    capability: graph_assembly
    provider: graph.canonical
    depends_on: [disambiguate]
    config: {corpus_id: latence-retrieval-signals-stack}

  - name: export_kg
    capability: export
    provider: export.knowledge_graph
    depends_on: [graph]
    config: {basename: graph}

  # The RAG corpus Export with the OPTIONAL index-time retrieval-signal generators wired additively
  # (ADR-0049/0050/0053). The dense embedding + SPLADE sparse columns land in records.parquet; the
  # FDE dense column too; the raw multi-vectors ride the multivectors.parquet sidecar. All over the
  # redacted corpus text (Export depends on `redact`).
  - name: export_corpus
    capability: export
    provider: export.jsonl_parquet
    depends_on: [redact]
    config:
      basename: corpus
      embedder:
        provider: embedding.hashing
        config: {dimension: 32}
      sparse_embedder:
        provider: sparse.hashing
        config: {vocab_size: 1024}
      multivector_embedder:
        provider: multivector.hashing
        config: {dimension: 8}
      fde_converter:
        provider: fde.reference
        config: {input_dimension: 8, buckets: 4}
      keep_multivectors: true
