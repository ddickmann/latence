# stacks/context-enrichment.yaml — the blessed default spine PLUS the OPTIONAL W13
# context_enrichment Stage, so `latence stack validate` exercises the KG→chunk projection
# end-to-end (ADR-0039).
#
# The blessed default spine (stacks/default.yaml) is byte-identical here, with ONE addition: an
# `enrich` Stage after Graph Assembly (`context.kg_header`) that projects the assembled KG back onto
# each chunk as a compact context_header (its canonical entities + top-k neighbor triples). default.yaml
# itself declares NO context_enrichment Stage (the Stage is genuinely optional, ADR-0039), so this
# dedicated stack has the seam present so stack-validate runs it end-to-end (contracts + determinism +
# resume) on the bundled corpus.
#
# NOTE (W16, ADR-0042): the RAG corpus Export now wires to `enrich`, which reads the REDACTED chunk
# stream (`redact` → `enrich` → `export_corpus`). Since W16 Redaction is a chunk→chunk transform that
# sets each chunk's `masked_content` (the clean `content` stays un-redacted), and the Export
# materializes `masked_content` as the corpus text, the exported corpus is BOTH masked (PII-safe —
# the stack-validate rag-scan passes) AND enriched (the context_header prepends to the EMBEDDING input
# only). This resolves the pre-W16 constraint where the RAG export had to bypass enrichment to avoid
# leaking the un-redacted chunk `content`. Every other Stage is byte-identical to default.yaml.
name: latence-context-enrichment-stack
storage_uri: "{STORAGE_URI}"
stages:
  - name: source
    capability: source
    provider: source.local_folder
    config:
      path: "{CORPUS_DIR}"
      sensitivity: internal
      extensions: [txt, md, markdown, pdf, zip]

  - name: intake_screen
    capability: intake_screening
    provider: screening.intake_signature
    depends_on: [source]
    config:
      max_bytes: 2097152
      max_zip_ratio: 50.0

  - name: parse
    capability: parse
    provider: parser.pdfplumber
    depends_on: [intake_screen]

  - name: chunk
    capability: chunk
    provider: chunk.markdown
    depends_on: [parse]
    config: {max_tokens: 256, overlap_tokens: 32, min_tokens: 8}

  - name: content_screen
    capability: content_screening
    provider: screening.content_keyword
    depends_on: [chunk]

  - name: entities
    capability: entity_extraction
    provider: entity.gazetteer
    depends_on: [content_screen]
    config:
      labels:
        ORG:
          terms: [Acme, Acme Corporation, International Business Machines, IBM, Globex]
        PERSON:
          terms: [Alice, Bob, Carol]

  - name: relations
    capability: relation_extraction
    provider: relation.pattern
    depends_on: [content_screen, entities]
    config:
      window_chars: 200
      relations:
        works_for: {head: PERSON, tail: ORG, triggers: [works at, employed by, joined]}
        partner_of: {head: ORG, tail: ORG, triggers: [partner of, partnered with]}

  - name: redact
    capability: redaction
    provider: redaction.hybrid_rule
    depends_on: [content_screen]   # W16 (ADR-0042): chunk→chunk PII masking (no doc truncation)

  - name: profiling
    capability: profiling
    provider: profiling.statistical
    depends_on: [parse, entities]

  - name: disambiguate
    capability: disambiguation
    provider: disambiguation.cascade
    depends_on: [entities, relations]
    config:
      kb:
        - {kb_id: Q1, name: Acme, entity_type: ORG}
        - {kb_id: Q2, name: International Business Machines, entity_type: ORG, aliases: [IBM]}
      kb_threshold: 0.5

  - name: graph
    capability: graph_assembly
    provider: graph.canonical
    depends_on: [disambiguate]
    config: {corpus_id: latence-context-enrichment-stack}

  # The OPTIONAL W13 Stage under validation: project the assembled KG back onto each chunk as a
  # compact, capped, confidence-gated context_header (canonical entities + top-k neighbor triples).
  # W16 (ADR-0042): enrich reads the REDACTED chunk stream (masked_content set) so the corpus row is
  # masked AND enriched. The context_header prepends to the EMBEDDING input only; the stored corpus
  # text is masked_content (PII-safe). This is what lets export_corpus wire to `enrich` (see NOTE).
  - name: enrich
    capability: context_enrichment
    provider: context.kg_header
    depends_on: [redact, graph]
    config:
      max_neighbors_per_entity: 4
      max_triples: 6
      min_entity_confidence: 0.0
      min_edge_confidence: 0.0

  - name: export_kg
    capability: export
    provider: export.knowledge_graph
    depends_on: [graph]
    config: {basename: graph}

  - name: export_corpus
    capability: export
    provider: export.jsonl_parquet
    depends_on: [enrich]   # W16: the redacted+enriched chunk stream — masked (PII-safe) AND enriched
    config: {basename: corpus}
