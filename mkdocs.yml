      - Provider catalog: providers/catalog.md
      - Extending the pipeline: extending.md
      - Writing an adapter (AdapterBase): writing-an-adapter.md
      - ProviderProfile & device handling: provider-profile.md
      - Conformance checklist: CONFORMANCE.md
      - Embedders: embedders.md

  # --- Task-focused operator guides ----------------------------------------------------------
  - Guides:
