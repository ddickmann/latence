      # the five tutorials landed from the docs-quickstart lane, so their nav entries are now
      # real files and `mkdocs build --strict` resolves them. Slugs are the filenames that
      # actually shipped (`tutorials/01-…` … `tutorials/05-…`, not the guessed `1-…`).
      - Quickstart — from a folder to a queryable corpus: quickstart.md
      - Tutorials:
          - tutorials/index.md
          - Your first pipeline: tutorials/01-your-first-pipeline.md
          - Understanding the output: tutorials/02-understanding-the-output.md
