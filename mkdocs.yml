site_name: Latence Framework
site_description: >-
  A model-agnostic, cloud-agnostic framework that turns messy, siloed enterprise
  data into high-quality, AI-ready data — parsing through NER, relation extraction,
  PII handling, enrichment and disambiguation to corpus-level knowledge graphs.
site_author: ddickmann
site_url: https://ddickmann.github.io/latence/
repo_name: ddickmann/latence
repo_url: https://github.com/ddickmann/latence
edit_uri: edit/main/docs/
copyright: >-
  Apache-2.0 licensed; commercial use granted by the licence, no agreement
  needed (COMMERCIAL.md). Reference Providers ship permissive weights only
  (ADR-0012); restricted-license models are opt-in.

docs_dir: docs

theme:
  name: material
  language: en
  # The mark alone (not the lockup): Material renders it beside site_name in the header, so the
  # wordmark would appear twice. Same file serves as the favicon.
  logo: assets/mark.svg
  favicon: assets/mark.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

plugins:
  - search
  - mermaid2
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - packages/latence-core/src
            - packages/latence-parser-pdfplumber/src
            - packages/latence-parser-plaintext/src
            - packages/latence-disambig-embedding/src
          options:
            docstring_style: sphinx
            docstring_section_style: table
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_if_no_docstring: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source
            filters:
              - "!^_"
            heading_level: 2

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      # GitHub-compatible heading slugs. The same markdown is read on github.com and on
      # the docs site, so a hand-written `#anchor` must resolve on BOTH. Python-Markdown's
      # default slugifier collapses runs of separators ("GPU requirements + the Blackwell
      # note" -> `gpu-requirements-the-blackwell-note`) while GitHub keeps them
      # (`gpu-requirements--the-blackwell-note`); pymdownx's slugify matches GitHub.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ddickmann/latence

# ---------------------------------------------------------------------------------------------
# NAV — organised by AUDIENCE, matching the four reading paths on the home page:
#   Get started / Guides  -> the operator      Providers / Reference -> the Provider author
#   Concepts              -> the evaluator     Decision log / Project -> the contributor
#
# TWO THINGS BREAK `mkdocs build --strict`, which is what CI runs:
#   1. An UNQUOTED COLON in a title. `- 0052 — Retrieval MCP: ported …` is not valid YAML.
#      Every title containing `:` below is quoted; keep it that way.
#   2. A nav entry pointing at a file that does not exist — strict turns the warning into an
#      error. Do not add an entry ahead of its page.
# ---------------------------------------------------------------------------------------------
nav:
  - Home: index.md

  # --- The operator's entry point ------------------------------------------------------------
  - Get started:
      - getting-started/index.md
      # Wired live at integration time, per the placeholder this replaces: the quickstart and
      # the five tutorials landed from the docs-quickstart lane, so their nav entries are now
      # real files and `mkdocs build --strict` resolves them. Slugs are the filenames that
      # actually shipped (`tutorials/01-…` … `tutorials/05-…`, not the guessed `1-…`).
      - Quickstart — from a folder to a corpus and a knowledge graph: quickstart.md
      - Tutorials:
          - tutorials/index.md
          - Your first pipeline: tutorials/01-your-first-pipeline.md
          - Understanding the output: tutorials/02-understanding-the-output.md
          - Bringing your own Provider: tutorials/04-bringing-your-own-provider.md
          - Production: tutorials/05-production.md
      - Read the results — the run console: getting-started/run-console.md
      - Long-form walkthroughs:
          - Fresh GPU pod → AI-ready data: TUTORIAL-fresh-pod-walkthrough.md
          - GPU testing guide: GPU-TESTING-GUIDE.md

  # --- The evaluator's entry point -----------------------------------------------------------
  - Concepts:
      - concepts/index.md
      - Architecture: concepts/architecture.md
      - Domain language: concepts/domain-language.md
      - Pipeline Stages: pipeline/index.md
      # The anatomy guide: exhaustive and grounded in the pipeline that actually produced the
      # benchmark results. The index is readable alone; the three chapters are the zoom-in, in
      # DAG order.
      - Pipeline anatomy:
          - anatomy/index.md
          - "1 · Ingest & document understanding": anatomy/01-ingest-and-document-understanding.md
          - "2 · Extraction & privacy": anatomy/02-extraction-and-privacy.md
          - "3 · Corpus → knowledge graph": anatomy/03-corpus-to-knowledge-graph.md
          - "4 · The knowledge-graph export": anatomy/04-knowledge-graph-export.md

  # --- The Provider author's entry point -----------------------------------------------------
  - Providers:
