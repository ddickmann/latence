name: CI

# Fast, required merge gates. The heavy/slow lanes (MinIO s3:// e2e, the Airflow DAG
# lane, and the Goal-B per-Stage bake-offs) live in ci-heavy.yml so PR feedback here
# stays quick. scripts/verify-local.sh mirrors ALL of these gates locally.
on:
  push:
    branches: ["**"]
  pull_request:

# One in-flight run per ref; a new push cancels the previous run of THIS workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here only ever reads the repo.
permissions:
  contents: read

env:
  # Hash-stable runs for deterministic tests (the root conftest fails fast if unset).
  PYTHONHASHSEED: "0"

jobs:
  secret-scan:
    name: secret scan (detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      # Fail CI if any NEW potential secret appears that is not accounted for in the
      # audited .secrets.baseline (every baseline entry is audited is_secret=false:
      # test fixtures, CI minio creds, doc placeholders). A real secret would not be
      # in the baseline, so the gate surfaces it and this step exits non-zero.
      #
      # The gate is scripts/secret_scan_gate.py, NOT `detect-secrets scan --baseline`
      # + `git diff --exit-code`. That form rewrites volatile fields (the generated_at
      # timestamp and every finding's line_number) into the baseline on every run, so a
      # raw diff is guaranteed non-zero on a pristine tree with no new secret — CI-red
      # on merge, and it drowns a real new secret in constant noise. The script instead
      # runs a fresh scan and compares the SET of (filename, hashed_secret) pairs against
      # the audited baseline, ignoring line numbers and the timestamp entirely — pristine
      # tree is always green; only a genuinely new or newly-un-audited secret turns it red.
      # `uv run --with detect-secrets --no-project` puts the CLI on PATH without syncing.
      - name: detect-secrets (audited baseline gate)
        run: uv run --with detect-secrets --no-project python scripts/secret_scan_gate.py

  # ---- Fast-feedback gate: lint + strict types on a single interpreter. Everything
  # heavier (tests, stacks, build) waits on this so a lint/type break fails in ~1 min.
  lint-type:
    name: lint · type (fast gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Set up workspace (py3.12)
        uses: ./.github/actions/setup-workspace
        with:
          python-version: "3.12"

      # `benchmark/s5` is measurement-harness code, not a package — but it is the S5 campaign
      # stage's runtime (latence_benchmark.campaign.retrieval_stage imports it from the
      # checkout), it is declared in-scope + clean by ticket wayfinder-enterprise-serving/04,
      # and until now nothing in CI enforced that. Linted and (below) strictly typed here.
      #
      # The lint scope matches the in-scope set the ruff config's `exclude` comment claims —
      # packages, the benchmark harnesses, the campaign stage scripts and scripts/ — so the
      # claim is enforced rather than asserted. Frozen evidence scripts stay excluded there.
      - name: Ruff (lint)
        run: uv run ruff check packages benchmark/s5 benchmark/serving benchmark/sota-campaign scripts

      # Strict type check over BOTH src AND tests for every workspace package (issue #24).
      # The per-package loop (not a single `mypy --strict packages`) is deliberate: the
      # package dirs are hyphenated, so mypy maps every tests/conftest.py to the same bare
      # `conftest` module and a whole-tree invocation aborts with a duplicate-module error.
      # scripts/typecheck.sh runs mypy once per package so each conftest is unique in its
      # process; one non-zero exit fails the whole step.
      - name: Mypy (strict, src + tests)
        run: MYPY_CMD="uv run mypy" bash scripts/typecheck.sh

      # The S5 harness, checked as its own package (`-p benchmark.s5`, src + tests). The
      # per-package loop above cannot reach it — `benchmark/` holds no `packages/*/src` — and
      # the incidental reachability through latence-benchmark's wizard-mirror test covers only
      # the modules that test imports. This step is the harness's own gate.
      - name: Mypy (strict, benchmark/s5 harness)
        run: uv run mypy --strict --namespace-packages -p benchmark.s5

  # ---- Full test suite + provider conformance + coverage, on both interpreters.
  test:
    name: test · conformance · coverage (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint-type
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Set up workspace (py${{ matrix.python-version }})
        uses: ./.github/actions/setup-workspace
        with:
          python-version: ${{ matrix.python-version }}

      # Coverage is SURFACED, never hard-gated (a % threshold flakes; see the job summary
      # + the uploaded artifact + the `coverage:` line below for the badge-ready number).
      # Installed like the heavy sources (uv pip install into the synced venv, then uv run)
      # so it never perturbs the locked dev env.
      - name: Install pytest-cov
        run: uv pip install pytest-cov

      - name: Pytest (+ coverage)
        run: >-
          uv run pytest
          --cov=packages
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json

      # Provider Conformance suite (P3-F3, ADR-0036 §5): the enterprise-readiness gate,
      # parametrized over EVERY registered Provider (CPU providers run for real; endpoint/GPU
      # providers run the contract/graceful-failure/license/determinism subset against a
      # deterministic stub). Run explicitly with LATENCE_CUDA=0 so the device seam is a
      # reproducible CPU-only host and a GPU-declared provider is skipped-with-flag (never a
      # fabricated number). It also runs inside `Pytest` above; this dedicated step makes the
      # gate a visible, first-class check on both py3.11 + py3.12.
      - name: Provider conformance (LATENCE_CUDA=0, every registered provider)
        env:
          LATENCE_CUDA: "0"
        run: uv run pytest packages/latence-core/tests/test_conformance.py packages/latence-core/tests/test_e2e_conformance.py -q

      - name: Coverage summary → job summary + badge number
        if: always()
        run: |
          pct=$(python -c "import json; print(f\"{json.load(open('coverage.json'))['totals']['percent_covered']:.1f}\")")
          {
            echo "### Coverage — py${{ matrix.python-version }}"
            echo ""
            echo "**\`coverage: ${pct}%\`**  (line coverage over \`packages/\`, tests/vendor omitted)"
          } >> "$GITHUB_STEP_SUMMARY"
          # Badge-ready number on stdout for quick grepping / a shields.io endpoint.
          echo "coverage: ${pct}%"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: warn

  # ---- Goal A (P3-F4, ADR-0036 §3): the blessed stacks run end-to-end on the bundled
  # corpus (real Source→…→Export, not a config-parse smoke). Fast enough to keep on every
  # PR; the heavier per-Stage bake-offs (Goal B) live in ci-heavy.yml.
  stacks:
    name: stack validate (Goal A — end-to-end)
    runs-on: ubuntu-latest
    needs: lint-type
    env:
      LATENCE_CUDA: "0"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Set up workspace (py3.12)
        uses: ./.github/actions/setup-workspace
        with:
          python-version: "3.12"

      # GPU-declared Stages report skipped-with-flag on this CPU host (never faked); the
      # CPU-reachable spine of every committed stack still validates. Kept byte-aligned
      # with the stack list in scripts/verify-local.sh.
      - name: Validate committed stacks
        run: |
          uv run latence stack validate stacks/default.yaml
          uv run latence stack validate stacks/gpu-sota.yaml
          uv run latence stack validate stacks/gpu-sota-pod.yaml
          uv run latence stack validate stacks/gpu-sota-glinker.yaml
          uv run latence stack validate stacks/gpu-ocr.yaml
          uv run latence stack validate stacks/universal-parse.yaml
          uv run latence stack validate stacks/linkpred-base.yaml
          uv run latence stack validate stacks/schema-induction.yaml
          uv run latence stack validate stacks/context-enrichment.yaml

  # ---- Packaging gate: every publishable package builds a wheel + sdist. Runs only
  # after tests pass; uploads the dist/ tree so a release dry-run is one click away.
  build:
    name: build wheels + sdists (all packages)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      # Build EVERY package under packages/ (name == dist name here) into a single dist/.
      # Iterating the dir (vs a hardcoded list) means a newly added package can never be
      # silently left unbuilt/unpublished.
      - name: Build all packages
        run: |
          for pkg in packages/*/; do
            name="$(basename "$pkg")"
            echo "::group::uv build --package ${name}"
            uv build --package "${name}" --out-dir dist
            echo "::endgroup::"
          done
          echo "## Built distributions" >> "$GITHUB_STEP_SUMMARY"
          ls -1 dist >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
