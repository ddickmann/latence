name: Release

# Cut a release by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
#
# What fires automatically on a v* tag:
#   1. build          — build wheels + sdists for every package into dist/
#   2. github-release  — create the GitHub Release with generated notes + attach dist/*
#
# What is scaffolded but DELIBERATELY OFF (maintainer-manual-publish policy):
#   3. pypi-publish    — PyPI Trusted Publishing (OIDC). Present, wired, and gated behind
#                        `if: false` + a protected `pypi` Environment. It NEVER fires until
#                        a maintainer flips it on. See the enable checklist on that job.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for, e.g. v0.1.0"
        required: true

# Least privilege by default; each job elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"

jobs:
  build:
    name: build wheels + sdists (all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      # Build EVERY package under packages/ (dir name == distribution name) into one dist/.
      # Iterating the directory means a newly added package is automatically included in the
      # release rather than silently left out of a hand-maintained list.
      - name: Build all packages
        run: |
          for pkg in packages/*/; do
            name="$(basename "$pkg")"
            echo "::group::uv build --package ${name}"
            uv build --package "${name}" --out-dir dist
            echo "::endgroup::"
          done
          echo "## Distributions in this release" >> "$GITHUB_STEP_SUMMARY"
          ls -1 dist >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: GitHub Release (notes + artifacts)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # create the Release and upload assets
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true # auto changelog from merged PRs since the last tag
          fail_on_unmatched_files: true
          files: dist/*

  # ----------------------------------------------------------------------------------
  # PyPI Trusted Publishing (OIDC) — SCAFFOLDED, DISABLED.
  #
  # This job is intentionally NOT active: `if: false` short-circuits it on every run so a
  # tag push can never auto-publish to PyPI. It respects the maintainer-manual-publish
  # policy: releasing to PyPI stays a deliberate, human-gated act.
  #
  # ENABLE CHECKLIST (do all four, then delete the `if: false` line):
  #   1. On PyPI, create each distribution project (latence-core, latence-parser-*, …) and
  #      add a Trusted Publisher: owner=ddickmann, repo=latence-framework,
  #      workflow=release.yml, environment=pypi. (No API token is ever stored — OIDC only.)
  #   2. In repo Settings → Environments, create a `pypi` environment and add the
  #      maintainers as Required reviewers so each publish waits for a manual approval.
  #   3. Decide the brand/namespace first (see docs/RELEASING.md → "Open decisions"): the
  #      `latence-*` names must be available/owned on PyPI, or the publish 403s.
  #   4. Remove `if: false` below. The `id-token: write` permission + the pinned
  #      pypa/gh-action-pypi-publish action then do a tokenless OIDC upload of dist/*.
  # ----------------------------------------------------------------------------------
  pypi-publish:
    name: Publish to PyPI (Trusted Publishing — DISABLED)
    if: false # <<< remove to enable; see the ENABLE CHECKLIST above
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/latence-core/
    permissions:
      id-token: write # OIDC token for Trusted Publishing — no stored PyPI secret
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          packages-dir: dist
          # print-hash surfaces the uploaded file digests in the log for auditability.
          print-hash: true
          # To rehearse against TestPyPI first, set:
          # repository-url: https://test.pypi.org/legacy/
