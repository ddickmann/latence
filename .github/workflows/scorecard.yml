name: OpenSSF Scorecard

# Supply-chain security posture scoring (branch protection, token permissions,
# pinned dependencies, dangerous workflow patterns, …). Runs on the default branch
# and weekly — NOT on pull requests, so a fork PR can never request the elevated
# token this needs. Results appear in the Security tab (and, if enabled, on the
# OpenSSF Scorecard badge).

on:
  branch_protection_rule:
  schedule:
    - cron: "18 5 * * 1"
  push:
    branches: ["main"]

# Read-only by default at the top level.
permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to the Security tab
      id-token: write          # publish results to the OpenSSF API (public repos)
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results uploads the score to the public OpenSSF API so a badge
          # can render it. Only meaningful on a public repo; harmless otherwise.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3.37.1
        with:
          sarif_file: results.sarif
