blank_issues_enabled: false
contact_links:
  # No GitHub Discussions link here, deliberately: Discussions is NOT enabled on this
  # repository, so a /discussions URL in the issue chooser is a dead end that looks like a
  # supported channel. SUPPORT.md is the live routing table and says the same thing in prose.
  # If Discussions is ever turned on, this entry becomes the Discussions link again and the
  # matching row in SUPPORT.md changes with it — the two must never disagree.
  - name: Getting help — where to ask what
    url: https://github.com/ddickmann/latence-framework/blob/main/SUPPORT.md
    about: >
      Usage questions and design sanity-checks: what channel exists for what, what makes a
      question answerable, and what this project explicitly does not offer (no SLA, no paid
      support). Read this before filing a bug for a how-do-I question.
  - name: Report a security vulnerability (private)
    url: https://github.com/ddickmann/latence-framework/security/advisories/new
    about: >
      Do NOT open a public issue for a suspected vulnerability. Report it privately via
      GitHub Security Advisories (or email per SECURITY.md) for coordinated disclosure.
  - name: Contributing guide — read this before writing code
    url: https://github.com/ddickmann/latence-framework/blob/main/CONTRIBUTING.md
    about: >
      Dev setup, the gates, the test-first rule, the ADR process, how to add a Provider
      without touching core — and the CLA requirement that applies to every merged
      contribution. Worth ten minutes before you start.
