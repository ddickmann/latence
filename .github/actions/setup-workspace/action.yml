name: Set up latence workspace
description: >-
  Install uv, sync the CPU-first dev env, and install the heavy/endpoint Provider
  SOURCES with --no-deps (their tests monkeypatch the heavy dep). Mirrors
  scripts/verify-local.sh so CI and local-verify install an identical env.

inputs:
  python-version:
    description: Python version to install and sync against (e.g. "3.11", "3.12").
    required: true

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: true

    - name: Set up Python ${{ inputs.python-version }}
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Sync workspace (dev env)
      shell: bash
      run: uv sync --python ${{ inputs.python-version }}

    # The heavy/endpoint Providers are workspace members but NOT in the dev env's deps
    # (torch/transformers, apache-airflow, the openai client, the Presidio/spaCy stack,
    # the GLinker/ULTRA stacks would all break the CPU-first, offline, deterministic test
    # env — ADR-0007/0016). Install ONLY their source (no deps) so their src is
    # type-checked and their offline tests (which monkeypatch the heavy/endpoint dep with a
    # fake, or use the Airflow-free in-process path) collect and run. The list is read from
    # scripts/heavy-packages.txt, the single source shared with the Makefile and
    # scripts/verify-local.sh; it used to be a hand-synchronised copy.
    - name: Install heavy/endpoint Provider sources (no heavy deps)
      shell: bash
      run: |
        while read -r p; do
          uv pip install --no-deps -e "packages/$p"
        done < <(grep -vE '^[[:space:]]*(#|$)' scripts/heavy-packages.txt)
