[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latence-runner-airflow"
version = "0.1.0"
description = "Airflow Runner adapter — run the identical Latence Stages under Apache Airflow, using Airflow's own state/scheduling (ADR-0003, ADR-0010)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ddickmann", email = "ddickmann81@gmail.com" }]
# apache-airflow is a heavy optional dependency isolated in THIS adapter (ADR-0016): it ships as an
# EXTRA, not a hard dep, so the in-process second-Runner proof (and its tests) run offline with no
# Airflow install. Apache Airflow is Apache-2.0. Only an adopter deploying a real Airflow DAG needs
# the extra.
dependencies = [
    "latence-core",
]

[project.optional-dependencies]
airflow = ["apache-airflow>=2.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/latence_runner_airflow"]
