[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latence-extract-gliner2"
version = "0.1.0"
description = "Fused zero-shot Entity+Relation Extraction Provider over the fastino GLiNER2 framework (native quantize+compile, CPU/GPU) for the Latence framework."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ddickmann", email = "ddickmann81@gmail.com" }]
keywords = ["ai-ready-data", "knowledge-graph", "rag", "nlp", "data-pipeline", "model-agnostic", "entity-extraction", "relation-extraction", "gliner", "gliner2", "fused", "zero-shot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
# Heavy/optional deps stay OUT of latence-core (ADR-0016): the GLiNER2 model stack
# (gliner2 -> torch/transformers, mdeberta-v3 encoder) ships with THIS Provider package,
# not the thin core. Both the gliner2 library AND the default fastino/gliner2-multi-v1
# checkpoint are Apache-2.0 (weights AND code verified permissive — see provider.py header,
# 2026-07-10; the HF model card is Apache-2.0 and NOT gated, the github.com/fastino-ai/GLiNER2
# LICENSE is Apache-2.0). Nothing downloads unless a Pipeline configures this Provider.
# H-G1 dep cap: 'gliner2' is a released 1.x library (latest 1.3.2, verified 2026-07-10), so it
# carries a major-boundary upper cap ('<2') so a downstream install can't silently pull an
# API-breaking 2.x release. The [local] extra is REQUIRED (the base dist ships no torch/
# transformers; local inference — GLiNER2.from_pretrained(...).batch_extract_entities /
# batch_extract_relations — needs them), exactly like latence-pii-gliner2.
# T7 raised the LOWER bound to 1.3 (was 1.0): the Provider now drives the BATCHED entry points
# (one native forward per label bucket), and that slice does not exist across the whole 1.x line —
# 1.0.x has no batch_extract_* at all, 1.1.x has no include_spans/max_len (and without spans there
# are no char offsets to ground on), 1.2.0-1.2.5 have no max_len. 1.3.x is the pod-validated line,
# the same floor latence-pii-gliner2 pins. Resolution is the primary gate; the Provider ALSO checks
# the loaded object exposes both batched methods, so a hand-installed older gliner2 is a typed
# ProviderError rather than a native AttributeError.
# 'peft' is a REQUIRED runtime dep (pod-found, 2026-07-10): gliner2's relation inference engine
# (gliner2.inference.engine -> gliner2.training.trainer) imports peft, which the 'gliner2[local]'
# extra does NOT declare — real extract_relations fails with ModuleNotFoundError: No module named
# 'peft' without it. peft is Apache-2.0 (github.com/huggingface/peft, verified 2026-07-10).
# H-G1 (ADR-0065): 'peft' now carries the '<1' cap the paragraph below always implied — it is a
# REQUIRED runtime import on the relation path, so an unbounded resolve could hand this Provider a
# peft major its call sites are not written against. Enforced by
# packages/latence-core/tests/test_dependency_caps.py.
dependencies = [
    "latence-core",
    "gliner2[local]>=1.3,<2",
    "peft>=0.10,<1",
]

[project.urls]
Homepage = "https://github.com/ddickmann/latence-framework"
Repository = "https://github.com/ddickmann/latence-framework"
Documentation = "https://ddickmann.github.io/latence-framework/"
Issues = "https://github.com/ddickmann/latence-framework/issues"
Changelog = "https://github.com/ddickmann/latence-framework/blob/main/CHANGELOG.md"

# Registers the FUSED Provider under the discovery group. Installing this package makes
# 'fused_entity_relation.gliner2' available to any Pipeline with no core change (ADR-0004). It
# fulfils Entity+Relation Extraction in one pass (ADR-0013) — a drop-in swap for
# 'relation.gliner_relex' (same FusedEntityRelationExtractor Capability + record contract), and
# the blessed unified default extraction engine (ADR-0036, W9).
[project.entry-points."latence.providers"]
"fused_entity_relation.gliner2" = "latence_extract_gliner2.provider:Gliner2FusedExtractor"

[tool.hatch.build.targets.wheel]
packages = ["src/latence_extract_gliner2"]
