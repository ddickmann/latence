[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latence-core"
version = "0.1.0"
description = "Latence framework core: data contracts, Capability protocols, Pipeline, local Runner, Storage seam."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ddickmann", email = "ddickmann81@gmail.com" }]
keywords = ["ai-ready-data", "knowledge-graph", "rag", "nlp", "data-pipeline", "model-agnostic", "contracts", "pipeline", "runner", "storage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
# Near-zero deps (ADR-0016): only the contract/serialization/IO/CLI spine.
dependencies = [
    "pydantic>=2.5",
    "fsspec>=2024.2",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/ddickmann/latence-framework"
Repository = "https://github.com/ddickmann/latence-framework"
Issues = "https://github.com/ddickmann/latence-framework/issues"

[project.scripts]
latence = "latence_core.cli:app"

# Built-in reference Providers ship inside core so the demo runs end to end
# (ADR-0004). Additional Providers live in their own packages.
[project.entry-points."latence.providers"]
"source.local_folder" = "latence_core.stages.source:LocalFolderSource"
"export.jsonl_parquet" = "latence_core.stages.export:JsonlParquetExport"
# S3 built-ins: offset-preserving Chunker + the two Screening checkpoints. Pure
# Python (no extra deps), so they ship in core for the end-to-end demo (ADR-0004).
"chunk.markdown" = "latence_core.stages.chunk:MarkdownChunker"
# Second reference Chunker (#77 'providers' hardening bar): whole-sentence packing,
# sentence-aligned boundaries, no overlap — a distinct CPU strategy behind the same seam.
"chunk.sentence_window" = "latence_core.stages.chunk:SentenceWindowChunker"
"screening.intake_signature" = "latence_core.stages.screening:SignatureSizeIntakeScreener"
"screening.content_keyword" = "latence_core.stages.screening:KeywordContentScreener"
# Second reference Content Screener (#77): a bounded fuzzy/scoring injection detector
# (obfuscation-tolerant token-gap matching) behind the same seam as the keyword screener.
"screening.content_fuzzy" = "latence_core.stages.screening:FuzzyInjectionContentScreener"
# S4 built-in: deterministic zero-shot gazetteer/regex entity extractor (pure
# Python, no extra deps). The learned GLiNER Provider lives in latence-ner-gliner.
"entity.gazetteer" = "latence_core.stages.entity:GazetteerEntityExtractor"
# S5 built-in: deterministic zero-shot trigger-phrase relation extractor (pure
# Python, no extra deps). The LLM + fused gliner-relex Providers live in
# latence-relation-llm / latence-relation-gliner (ADR-0013, empirical choice).
"relation.pattern" = "latence_core.stages.relation:PatternRelationExtractor"
# S6 built-in: deterministic hybrid-rule PII redactor (regex library + gazetteer +
# custom patterns; policy keyed off Classification.sensitivity). Pure Python, no
# extra deps. The learned GLiNER-PII Provider lives in latence-pii-gliner (ADR-0024).
"redaction.hybrid_rule" = "latence_core.stages.redaction:HybridPIIRedactor"
# S7 built-in: deterministic streaming corpus profiler (per-document density /
# readability / Zipf / compression + cross-document entity frequency / co-occurrence /
# type consensus / source coverage). Pure Python, no extra deps (ADR-0025).
"profiling.statistical" = "latence_core.stages.profiling:StatisticalProfiler"
# Second reference Profiler (#77): a scale-oriented lightweight profiler — same feature
# contract, streaming, but skips the O(n²) co-occurrence pairing for huge corpora.
"profiling.lightweight" = "latence_core.stages.profiling:LightweightProfiler"
# S8 built-in: deterministic CPU-viable cascade disambiguator (5-strategy entity
# resolver + Union-Find + audited merge log; GLinker-style KB linking with graceful
# fallback; relation normalizer with inverse detection). Pure Python, no extra deps —
# the FAISS/GPU blocking Provider is a pluggable upgrade behind this same seam (ADR-0026).
"disambiguation.cascade" = "latence_core.stages.disambiguation:CascadeDisambiguator"
# Second reference Disambiguator (#77): exact normalized-surface blocking (no fuzzy
# cascade) — a high-precision, alias/KB-driven CPU alternative behind the same seam.
"disambiguation.exact_surface" = "latence_core.stages.disambiguation:ExactSurfaceDisambiguator"
# S9 built-ins: the canonical Graph Assembler (deterministic content-addressed nodes/edges +
# per-edge Evidence, ported graph builder) and the KG Export (Parquet + TTL + GraphML as
# portable files, never a live DB — ADR-0017). Plus a deterministic reference Embedder (opt-in
# RAG-corpus embeddings; the learned Granite r2 default is a pluggable package). Pure Python,
# no extra deps (ADR-0007/0016).
"graph.canonical" = "latence_core.stages.graph_assembly:CanonicalGraphAssembler"
# Second reference Graph Assembler (#77): edge-weight-aggregating assembler that folds
# parallel same-typed relations into one weighted edge — a distinct CPU strategy, same
# deterministic-id + per-edge-Evidence contract, behind the same seam.
"graph.weighted" = "latence_core.stages.graph_assembly:WeightedGraphAssembler"
# W2-linkpred Slice 1/2: the OPTIONAL post-Assembly GraphCompleter reference Provider — a
# deterministic, bounded 2-hop transitive/symmetric closure that appends PREDICTED edges marked
# properties.inferred=True (honest model-derived Evidence, never merged into asserted edges). Pure
# Python, no torch (ADR-0037). The learned ULTRA/PyKEEN scorer is Slice 2, behind the same seam.
"graph_completion.reference" = "latence_core.stages.graph_completion:ReferenceGraphCompleter"
# W13 context enrichment: the OPTIONAL post-Assembly ContextEnricher reference Provider — a
# deterministic, capped, zero-dep projection of the assembled KG back onto each chunk as a compact
# context_header (canonical entities + top-k neighbor triples) the Export prepends to the EMBEDDING
# input only (ADR-0039). Pure Python, no model, no key. The LLM situating-sentence mode is a
# documented follow-on, not a default Provider.
"context.kg_header" = "latence_core.stages.context_enrichment:ContextHeaderEnricher"
"export.knowledge_graph" = "latence_core.stages.graph_export:KnowledgeGraphExport"
"embedding.hashing" = "latence_core.embedding:HashingEmbedder"
# S11 built-in: the affected-set DeltaProcessor (retract-by-Evidence-provenance graph patcher +
# blocking-neighborhood affected-set recompute catching merge-on-add / split-on-delete; drift-
# triggered Reconciliation). Pure Python, deterministic, CPU-viable — a distributed blocking
# Provider is a pluggable upgrade behind this same seam (ADR-0018).
"delta.affected_set" = "latence_core.stages.delta:AffectedSetDeltaProcessor"

[tool.hatch.build.targets.wheel]
packages = ["src/latence_core"]
