[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latence-relation-llm"
version = "0.1.0"
description = "LLM Relation Extraction Provider (any OpenAI-compatible endpoint, incl. local Ollama) for the Latence framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ddickmann", email = "ddickmann81@gmail.com" }]
keywords = ["ai-ready-data", "knowledge-graph", "rag", "nlp", "data-pipeline", "model-agnostic", "relation-extraction", "llm", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
# The endpoint client is optional/heavy relative to the thin core (ADR-0016): it
# ships with THIS Provider, not latence-core. The 'openai' client is Apache-2.0
# (code); this Provider bundles NO weights — it calls a user-supplied endpoint
# (OpenAI, vLLM, Together, or a local Ollama). Nothing is called unless a Pipeline
# configures this Provider.
# H-G1 dep cap: 'openai' is a fast-moving lib whose API breaks across majors, so it carries an
# upper cap to keep a downstream install from silently pulling an API-breaking major. The current
# major is 2.x (verified 2026-07-08), so the cap is '<3' (the real current-major boundary) — NOT
# the '<2' an older 1.x baseline would suggest, which would exclude the shipping 2.x line.
dependencies = [
    "latence-core",
    "openai>=1.0,<3",
]

# Registers this Provider under the framework's discovery group. Installing this
# package makes 'relation.llm' available to any Pipeline with no core change
# (ADR-0004), alongside the in-core deterministic 'relation.pattern'.
[project.urls]
Homepage = "https://github.com/ddickmann/latence-framework"
Repository = "https://github.com/ddickmann/latence-framework"
Issues = "https://github.com/ddickmann/latence-framework/issues"

[project.entry-points."latence.providers"]
"relation.llm" = "latence_relation_llm.provider:LLMRelationExtractor"

[tool.hatch.build.targets.wheel]
packages = ["src/latence_relation_llm"]
