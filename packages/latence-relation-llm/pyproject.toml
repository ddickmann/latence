[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latence-relation-llm"
version = "0.1.0"
description = "LLM Relation Extraction Provider (any OpenAI-compatible endpoint, incl. local Ollama) for the Latence framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ddickmann", email = "ddickmann81@gmail.com" }]
# The endpoint client is optional/heavy relative to the thin core (ADR-0016): it
# ships with THIS Provider, not latence-core. The 'openai' client is Apache-2.0
# (code); this Provider bundles NO weights — it calls a user-supplied endpoint
# (OpenAI, vLLM, Together, or a local Ollama). Nothing is called unless a Pipeline
# configures this Provider.
dependencies = [
    "latence-core",
    "openai>=1.0",
]

# Registers this Provider under the framework's discovery group. Installing this
# package makes 'relation.llm' available to any Pipeline with no core change
# (ADR-0004), alongside the in-core deterministic 'relation.pattern'.
[project.entry-points."latence.providers"]
"relation.llm" = "latence_relation_llm.provider:LLMRelationExtractor"

[tool.hatch.build.targets.wheel]
packages = ["src/latence_relation_llm"]
