[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latence-pii-gliner"
version = "0.1.0"
description = "Learned zero-shot PII Redaction Provider (GLiNER-PII, CPU via transformers/ONNX) for the Latence framework."
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "ddickmann", email = "ddickmann81@gmail.com" }]
keywords = ["ai-ready-data", "knowledge-graph", "rag", "nlp", "data-pipeline", "model-agnostic", "pii", "redaction", "gliner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
# Heavy/optional deps stay OUT of latence-core (ADR-0016): the GLiNER model stack
# (gliner -> torch/transformers) ships with THIS Provider package, not the thin
# core. Both the gliner library and the default urchade/gliner_multi_pii-v1
# checkpoint are Apache-2.0 (weights AND code verified permissive, ADR-0012,
# 2026-07-06; base model urchade/gliner_multi-v2.1 is Apache-2.0). Nothing downloads
# unless a Pipeline configures this Provider.
# H-G1 dep cap: 'gliner' is pre-1.0 and moves its API across 0.x MINORS (the effective majors),
# so it carries an upper cap so a downstream install can't silently pull an API-breaking release.
# The current line is 0.2.x (verified 2026-07-08); the cap is '<0.3' (the current-minor boundary).
dependencies = [
    "latence-core",
    "gliner>=0.2.5,<0.3",
]

# Registers this Provider under the framework's discovery group. Installing this
# package makes 'redaction.gliner_pii' available to any Pipeline with no core change
# (ADR-0004), alongside the in-core deterministic 'redaction.hybrid_rule' — it is the
# learned "model half" of the hybrid the S6 issue calls for.
[project.urls]
Homepage = "https://github.com/ddickmann/latence-framework"
Repository = "https://github.com/ddickmann/latence-framework"
Documentation = "https://ddickmann.github.io/latence-framework/"
Issues = "https://github.com/ddickmann/latence-framework/issues"
Changelog = "https://github.com/ddickmann/latence-framework/blob/main/CHANGELOG.md"

[project.entry-points."latence.providers"]
"redaction.gliner_pii" = "latence_pii_gliner.provider:GlinerPIIRedactor"

[tool.hatch.build.targets.wheel]
packages = ["src/latence_pii_gliner"]
