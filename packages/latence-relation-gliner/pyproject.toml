[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latence-relation-gliner"
version = "0.1.0"
description = "Fused zero-shot Entity+Relation Extraction Provider (gliner-relex, CPU via transformers/ONNX) for the Latence framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ddickmann", email = "ddickmann81@gmail.com" }]
keywords = ["ai-ready-data", "knowledge-graph", "rag", "nlp", "data-pipeline", "model-agnostic", "relation-extraction", "gliner", "fused", "zero-shot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
# Heavy/optional deps stay OUT of latence-core (ADR-0016): the GLiNER model stack
# (gliner -> torch/transformers) ships with THIS Provider package, not the thin
# core. Both the gliner library and the default knowledgator/gliner-relex-multi-v1.0
# checkpoint are Apache-2.0 (weights AND code verified permissive, ADR-0012,
# 2026-07-06); nothing downloads unless a Pipeline configures this Provider.
# H-G1 dep cap: 'gliner' is pre-1.0 and moves its API across 0.x MINORS (the effective majors),
# so it carries an upper cap so a downstream install can't silently pull an API-breaking release.
# The current line is 0.2.x (verified 2026-07-08); the cap is '<0.3' (the current-minor boundary).
dependencies = [
    "latence-core",
    "gliner>=0.2.5,<0.3",
]

# Registers the FUSED Provider under the discovery group. Installing this package
# makes 'relation.gliner_relex' available to any Pipeline with no core change
# (ADR-0004). It fulfils Entity+Relation Extraction in one pass (ADR-0013).
[project.urls]
Homepage = "https://github.com/ddickmann/latence-framework"
Repository = "https://github.com/ddickmann/latence-framework"
Issues = "https://github.com/ddickmann/latence-framework/issues"
Changelog = "https://github.com/ddickmann/latence-framework/blob/main/CHANGELOG.md"

[project.entry-points."latence.providers"]
"relation.gliner_relex" = "latence_relation_gliner.provider:GlinerRelexExtractor"

[tool.hatch.build.targets.wheel]
packages = ["src/latence_relation_gliner"]
