[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latence-splade"
version = "0.1.0"
description = "Structured-composition SPLADE SparseEmbedder Provider (model term-weights ⊕ confidence-gated NER entities ⊕ metadata, redacted-by-default) for the Latence framework (ADR-0053)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ddickmann", email = "ddickmann81@gmail.com" }]
keywords = ["ai-ready-data", "knowledge-graph", "rag", "nlp", "data-pipeline", "model-agnostic", "sparse-retrieval", "splade", "hybrid-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
# Heavy deps stay OUT of latence-core (ADR-0016): the transformers/torch stack that runs the
# multilingual SPLADE MLM ships with THIS Provider package, not the thin core. The transformers
# library is Apache-2.0 (code, github.com/huggingface/transformers/blob/main/LICENSE); NO model
# checkpoint is pinned here — ADR-0053 requires the multilingual sparse model to be config-selected
# and its weights+code license verified SEPARATELY (ADR-0012) before it is wired, so this package
# blesses NO default (`model` is a required config value). Nothing downloads unless a Pipeline
# configures this Provider with a model it has cleared.
# H-G1 dep cap: 'transformers' moves its API across MINORS, so it carries an upper cap so a
# downstream install can't silently pull an API-breaking release.
dependencies = [
    "latence-core",
    "transformers>=4.40,<6",
]

[project.urls]
Homepage = "https://github.com/ddickmann/latence"
Repository = "https://github.com/ddickmann/latence"
Documentation = "https://ddickmann.github.io/latence/"
Issues = "https://github.com/ddickmann/latence/issues"
Changelog = "https://github.com/ddickmann/latence/blob/main/CHANGELOG.md"

# Registers this Provider under the framework's index-time discovery group (ADR-0004/0049). A
# SparseEmbedder is an index-time signal generator — the SPLADE-family sibling of the dense
# Embedder — so it registers under 'latence.providers' (the pipeline Stage seam), NOT the
# query-time 'latence.retrieval' group. Installing this package makes 'sparse.splade' available to
# any Pipeline's Export with no core change, alongside the in-core deterministic 'sparse.hashing'
# reference — swappable by one config line (ADR-0007).
[project.entry-points."latence.providers"]
"sparse.splade" = "latence_splade.provider:SpladeCompositionEmbedder"

[tool.hatch.build.targets.wheel]
packages = ["src/latence_splade"]
