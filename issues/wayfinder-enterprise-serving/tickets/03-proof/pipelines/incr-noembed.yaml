schema_version: 2
name: ticket03-incr-noembed
storage_uri: file:///Users/dennisdickmann/Developer/latence-framework/benchmark/sota-corpus/ticket03-proof/store-incr
extract_on: unmasked
stages:
- name: source
  capability: source
  provider: source.local_folder
  config:
    path: file:///Users/dennisdickmann/Developer/latence-framework/benchmark/sota-corpus/ticket03-proof/input/markdown
    sensitivity: internal
    extensions:
    - md
    - markdown
- name: intake_screen
  capability: intake_screening
  provider: screening.intake_signature
  depends_on:
  - source
  config:
    max_bytes: 26214400
    max_zip_ratio: 100.0
- name: parse
  capability: parse
  provider: parser.plaintext
  depends_on:
  - intake_screen
- name: chunk
  capability: chunk
  provider: chunk.markdown
  depends_on:
  - parse
  config:
    max_tokens: 640
    overlap_tokens: 80
    min_tokens: 8
- name: content_screen
  capability: content_screening
  provider: screening.content_keyword
  depends_on:
  - chunk
- name: extract
  capability: fused_entity_relation
  provider: fused_entity_relation.gliner2
  depends_on:
  - content_screen
  config:
    model: fastino/gliner2-multi-v1
    labels:
    - PERSON
    - ORGANIZATION
    - LOCATION
    - WORK
    - EVENT
    - DATE
    - PRODUCT
    relation_labels:
    - located_in
    - part_of
    - member_of
    - created_by
    - founded_by
    - spouse_of
    - directed_by
    - works_for
    - released_in
    threshold: 0.5
    device: cpu
- name: redact
  capability: redaction
  provider: redaction.gliner2
  depends_on:
  - content_screen
  config:
    pii_labels:
    - person
    - email
    - phone number
    - address
    - credit card number
    - social security number
    guardrails: true
    device: cpu
- name: profiling
  capability: profiling
  provider: profiling.statistical
  depends_on:
  - parse
  - extract
- name: consolidate_types
  capability: type_consolidation
  provider: type_consolidation.exact_surface
  depends_on:
  - extract
- name: disambiguate
  capability: disambiguation
  provider: disambiguation.exact_surface
  depends_on:
  - consolidate_types
- name: graph
  capability: graph_assembly
  provider: graph.canonical
  depends_on:
  - disambiguate
  config:
    corpus_id: s3-multihop_rag
    hyperedges:
      weak_hyperedges: true
      max_arity: 12
      min_tokens: 25
      max_tokens: 180
      max_window_sentences: 3
    graph_features:
      provider: graph_features.degree
- name: enrich
  capability: context_enrichment
  provider: context.kg_header
  depends_on:
  - redact
  - graph
  config:
    max_neighbors_per_entity: 4
    max_triples: 6
- name: export_kg
  capability: export
  provider: export.knowledge_graph
  depends_on:
  - graph
  config:
    basename: graph
    hyperedge_kv: true
- name: export_corpus
  capability: export
  provider: export.jsonl_parquet
  depends_on:
  - enrich
  config:
    basename: corpus
    context_columns: true
    unsafe_unmasked_corpus: true
    bm25:
      provider: tokenizer.regex
