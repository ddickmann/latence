[tool.uv.workspace]
members = ["packages/*"]
# The ONE package that cannot be a workspace member, and the reason is the point (ADR-0064).
#
# A uv workspace is ONE resolved environment: `uv lock` solves every member's dependencies
# together. `latence-gliner25` pins `gliner2[local]>=2.0,<3` while `latence-extract-gliner2` and
# `latence-pii-gliner2` pin `gliner2[local]>=1.3,<2`, and those windows are DISJOINT — gliner2 2.0
# is a major release whose 2.5 checkpoints are a different architecture head (`boundary` vs
# `span`), not a drop-in. Listing all three as members makes `uv lock` unsatisfiable, verbatim:
#
#   Because latence-extract-gliner2 depends on gliner2[local]>=1.3,<2 and latence-gliner25
#   depends on gliner2[local]>=2.0,<3, we can conclude that latence-extract-gliner2 and
#   latence-gliner25 are incompatible.
#
# That refusal is CORRECT and is the same fact `deploy/env/*/environment.yaml` enforces per
# environment (E-CONSTRAINT-CONFLICT). Excluding the package is not a workaround for it: it is
# the statement that the dev workspace resolves the gliner2 1.x line, and that the 2.5 Providers
# belong to an environment that resolves the 2.x line instead.
#
# The package is still a first-class distribution, and everything that could quietly have dropped
# it was checked and wired:
#   * `packages/*/pyproject.toml` globs (the contract reference, the environment specs, the
#     publish-readiness and release gates), ruff, `scripts/typecheck.sh` and pytest all cover it
#     BY DIRECTORY, so exclusion changes nothing for them;
#   * `scripts/verify-local.sh` installs its SOURCE with `--no-deps`, exactly as for every other
#     heavy Provider — which is what lets both gliner2 majors' offline tests run in one venv;
#   * the release builds it by PATH (`uv build "$pkg"`, not `--package <name>`, which resolves
#     through the workspace and cannot see it);
#   * it carries its OWN committed `uv.lock`, and `scripts/generate-sbom.sh` folds that lock's
#     export into the SBOM so a shipped distribution is never absent from the release's component
#     inventory. Both of those are gated (`test_release_integrity.py`).
exclude = ["packages/latence-gliner25"]

[tool.uv.sources]
latence-core = { workspace = true }
latence-parser-plaintext = { workspace = true }
latence-parser-document = { workspace = true }
latence-parser-pdfplumber = { workspace = true }
latence-ner-gliner = { workspace = true }
latence-relation-llm = { workspace = true }
latence-relation-gliner = { workspace = true }
latence-pii-gliner = { workspace = true }
latence-pii-gliner2 = { workspace = true }
latence-extract-gliner2 = { workspace = true }
latence-pii-presidio = { workspace = true }
latence-parser-endpoint = { workspace = true }
latence-parser-lighton = { workspace = true }
latence-parser-lighton-vllm = { workspace = true }
latence-parser-render = { workspace = true }
latence-ner-endpoint = { workspace = true }
latence-embedder-endpoint = { workspace = true }
latence-embedder-st = { workspace = true }
latence-disambig-embedding = { workspace = true }
latence-disambig-glinker = { workspace = true }
latence-runner-airflow = { workspace = true }
latence-source-sharepoint = { workspace = true }

latence-benchmark = { workspace = true }

latence-console = { workspace = true }
latence-demo = { workspace = true }

# Dev-only aggregate environment for the whole workspace.
[project]
name = "latence-framework-dev"
version = "0.0.0"
description = "Dev meta-project pinning the latence workspace for tooling (not published)."
requires-python = ">=3.11"
# latence-ner-gliner / latence-relation-gliner / latence-relation-llm /
# latence-pii-gliner / latence-pii-gliner2 / latence-extract-gliner2 / latence-pii-presidio / latence-parser-endpoint / latence-ner-endpoint /
# latence-embedder-endpoint / latence-embedder-st / latence-runner-airflow /
# latence-disambig-glinker are
# intentionally NOT pinned here: the gliner packages pull the heavy GLiNER stack
# (torch/transformers), the llm + the three -endpoint packages pull the openai client,
# latence-embedder-st pulls the sentence-transformers stack (torch/transformers),
# latence-pii-presidio pulls the Presidio + spaCy stack, the
# airflow adapter pulls apache-airflow, and latence-disambig-glinker pulls the GLinker linking
# stack (glinker/flashDeBERTa/transformers/torch/huggingface-hub) — installing any would break the
# CPU-first, offline, deterministic
# dev/test environment (ADR-0007/0016). They are still workspace members (built +
# type-checked from source), and installed --no-deps from source in CI + `make sync` +
# scripts/verify-local.sh so their offline tests collect + run. Each Provider
# / adapter is exercised with its heavy/endpoint dep monkeypatched with a fake (or, for
# the Airflow adapter, via its Airflow-free in-process path) in tests.
dependencies = [
    "latence-core",
    "latence-parser-plaintext",
    "latence-parser-document",
    # The first real Wave-1 adapter over AdapterBase (H-A1) — CPU-only, offline, pure-Python
    # (pdfplumber, MIT), no system binaries. Like latence-parser-document, it installs into the
    # default dev env so its tests + the conformance suite run offline/deterministically (unlike
    # the heavy/endpoint Provider packages below).
    "latence-parser-pdfplumber",
    # The S13 showable demo — CPU-only, offline, only depends on latence-core +
    # latence-parser-document (both already pinned), so it installs into the default
    # dev env and its tests run offline/deterministically (unlike the heavy/endpoint
    # Provider packages above).
    "latence-demo",
    # The learned (embedding-based) Disambiguator (W1 rework, #94) — CPU-viable and OFFLINE by
    # default: it resolves its Embedder from the registry defaulting to the in-core, deterministic,
    # dependency-free 'embedding.hashing', so it pulls NO heavy dep (only latence-core). Like
    # latence-parser-pdfplumber and latence-demo it installs into the default dev env so its tests +
    # the conformance suite run offline/deterministically (a learned embedder is a one-line opt-in).
    "latence-disambig-embedding",
    # The OPTIONAL Iceberg-table Export output's client (#184, ADR-0017). It is an EXTRA on the
    # published latence-core (`latence-core[iceberg]`), never a runtime dependency — but it IS
    # pinned into the dev env, deliberately: the #184 acceptance criterion is an end-to-end
    # verification against a REAL local Iceberg REST catalog, and the offline test
    # (packages/latence-core/tests/_iceberg_rest.py) drives the real RestCatalog client over real
    # HTTP against a real SqlCatalog. Faking pyiceberg would accept commits a real catalog rejects
    # and manufacture false green. It is safe for the CPU-first offline env: pure-Python, no torch,
    # no network at import, no model weights (Apache-2.0, ASF). `sql-sqlite` adds SQLAlchemy, the
    # metastore behind the local REST fixture.
    "pyiceberg[sql-sqlite]>=0.9",

    # The SharePoint/OneDrive Source connector (#182, ADR-0014/0018). Pure-Python and
    # DEPENDENCY-FREE (it speaks Microsoft Graph's REST/JSON API over the standard library), so
    # unlike the torch/openai Provider packages it installs into the default dev env like
    # latence-demo: its offline tests run against the faithful Graph fake it ships, and the
    # conformance suite (C1-C6) exercises the REAL connector against that fake.
    "latence-source-sharepoint",

    # The reproducible PUBLIC benchmark harness (#181). It is NOT a pipeline Provider — it
    # registers nothing under `latence.providers` — but it RUNS the real Stages through the real
    # registry, so it installs into the default dev env (like latence-demo) and its offline tests
    # score the real `parser.pdfplumber` Parse Stage over a faithful local dataset root. Its only
    # dependency is latence-core; remote dataset acquisition rides its `[hub]` extra (ADR-0016), so
    # plain `uv sync` stays CPU-first, offline and deterministic.
    "latence-benchmark",

    # The read-only run console (#186, ADR-0010/0017). ZERO new deps — `http.server` from the
    # standard library plus hand-rendered HTML — so, like latence-demo, it installs into the
    # default CPU-first dev env and its offline/deterministic tests run. It registers NO
    # Provider entry point: it reads the files a run left behind, it never joins a Pipeline.
    "latence-console",
]

# Documentation toolchain (mkdocs-material site + mkdocstrings autodoc + mermaid). An
# OPTIONAL extra so it never touches the CPU-first dev/test env (ADR-0007/0016): install
# with `uv sync --extra docs` (or `pip install -e ".[docs]"`). The API Reference autodocs
# `latence-core` + the CPU reference Providers already pinned in [project] dependencies
# above, so `uv sync --extra docs` makes them importable for mkdocstrings. Built + deployed
# by .github/workflows/docs.yml. See `make docs` / `make docs-serve`.
[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-mermaid2-plugin>=1.1",
    "black>=24.0",
]
# Optional observability EXPORT backends (ADR-0047), surfaced at the workspace root as a
# convenience mirror of `latence-core[observability]` so the whole workspace can be resolved
# with the export stack in one shot: `uv sync --extra observability`. The real extra is
# defined on latence-core (the published package); this only re-exports it. It never touches
# the CPU-first dev/test env (ADR-0007/0016) — plain `uv sync` still installs neither backend,
# and `latence_core.observability` degrades to a no-op when they are absent.
observability = [
    "latence-core[observability]",
]
# Optional Iceberg-table Export output (#184, ADR-0017), mirrored at the workspace root for the
# same one-shot-resolve convenience: `uv sync --extra iceberg`. The real extra is on latence-core.
iceberg = [
    "latence-core[iceberg]",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # Property-based testing for the H-docstage hardening bar (issue #74). DEV-only:
    # never a runtime dependency of any package, so thin-core (ADR-0016) is unaffected —
    # hypothesis appears only in this dev group, not in latence-core's dependencies.
    "hypothesis>=6.100",
    # PEP 440/508 parsing for the reproducible-environment verifier (issue #195). The real home is
    # the OPTIONAL ``latence-core[envspec]`` extra (thin core, ADR-0016); it is pinned in the DEV
    # group as well so ``latence env verify`` + its regression tests run in the plain workspace
    # env and in scripts/verify-local.sh without an extra install step.
    "packaging>=23.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages"]
# Frozen measurement-evidence scripts and one-off prototypes, retained VERBATIM because they
# produced numbers that are cited (the RFC proof and its dogfood run, one pod probe). They are
# not shipped, not imported by any package, and restyling them would churn recorded provenance
# for zero product value — so they are declared out of lint scope rather than left as permanent
# red. Everything else in the repo (packages/, the campaign library, scripts/) IS in scope and
# clean (ticket wayfinder-enterprise-serving/04). The scripts of benchmark/official,
# benchmark/official-data and benchmark/musique-subset were removed with the retrieval layer on
# 2026-11-10, so those folders hold no Python and are no longer listed.
exclude = [
    "benchmark/rfc",
    "scripts/_pod_probe_gliner.py",
    "results/dogfood-rfc",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# Tests may keep imports at runtime for readability and use assert freely.
"**/tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
# pyarrow / fsspec / yaml ship without complete type stubs. gliner, openai,
# sentence_transformers and presidio_analyzer are optional heavy/endpoint deps isolated in their
# Provider packages (not installed in the dev env by design, ADR-0016) and are treated as
# dynamically typed — the Providers monkeypatch them with fakes in tests.
[[tool.mypy.overrides]]
module = [
    "pyarrow.*", "fsspec.*", "yaml", "gliner", "gliner2", "openai", "sentence_transformers",
    "presidio_analyzer", "presidio_analyzer.*", "airflow.*",
    # LightOn-OCR heavy stack (latence-parser-lighton, GPU) — not in the CPU-first dev env
    # (ADR-0016); the Provider monkeypatches them with shape-matching fakes in tests.
    # ``torch.*`` as well as ``torch``: the TorchRuntime seam reaches submodules (``torch._dynamo``
    # for the compile-cache reset), and an override that named only the top package left those
    # import-not-found under the CPU-first env where torch is absent by design.
    "pypdfium2", "transformers", "torch", "torch.*",
    # Universal any-file Parser heavy stack (latence-parser-render, W5-universal-parser) — the
    # office/image readers (python-docx/openpyxl/python-pptx MIT, Pillow HPND) are isolated in that
    # package (ADR-0016), NOT in the CPU-first dev env; the Provider lazily imports them and its
    # tests use a faithful in-memory fake renderer + a stub OCR, so they are dynamically typed here.
    "PIL", "PIL.*", "docx", "openpyxl", "openpyxl.*", "pptx", "pptx.*",
    # Learned link-prediction heavy stack (latence-linkpred-ultra, GPU/heavy) — the ULTRA inference
    # deps (torch-geometric / torch-scatter / easydict) + the PyKEEN fallback are isolated in that
    # package (ADR-0016), NOT in the CPU-first dev env; the Provider lazily imports them and the
    # scorer tests monkeypatch a faithful fake, so they are treated as dynamically typed here.
    "torch_geometric", "torch_geometric.*", "torch_scatter", "easydict",
    "pykeen", "pykeen.*",
    # Enterprise GLinker Disambiguator heavy stack (latence-disambig-glinker, GPU) — the gliner
    # linking pipeline (gliner/flashDeBERTa/transformers/torch/huggingface_hub) + the OPTIONAL faiss
    # embedding-merge acceleration are isolated in that package (ADR-0016), NOT in the CPU-first dev
    # env; the Provider lazily imports them and its tests monkeypatch a faithful fake backend +
    # inject a fake STS embedder, so they are treated as dynamically typed here. numpy enters only
    # the OPTIONAL faiss-GPU path (not in the CPU env), so it too is treated as dynamically typed.
    "glinker", "flashdeberta", "huggingface_hub", "faiss", "numpy", "numpy.*",
    # OPTIONAL observability EXPORT backends (latence-core[observability], ADR-0047) — the
    # Prometheus + OpenTelemetry clients are isolated in that optional group (ADR-0016), NOT in the
    # CPU-first dev env; latence_core.observability lazily imports them and the seam's tests use a
    # fake MetricSink + exercise the real no-op-when-absent degrade, so they are dynamically typed.
    "prometheus_client", "opentelemetry", "opentelemetry.*",
]
ignore_missing_imports = true

# The VENDORED MIT ULTRA inference subset (models/layers/tasks/base_nbfnet) is third-party code kept
# verbatim (each file is ``# type: ignore``), so it is not type-checked and mypy treats it as
# dynamically typed — a strict pass over the framework's own code never fails on upstream ULTRA.
[[tool.mypy.overrides]]
module = ["latence_linkpred_ultra._vendor.*"]
ignore_errors = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["packages"]
# A watchdog, not a limit: when one test (set-up and tear-down included) runs longer than this
# many seconds, pytest writes every thread's traceback to the log and lets the test go on. The
# whole suite takes 20 to 40 minutes for some 4,400 tests, so a single test that is still
# running after 15 minutes is stuck, and this is what names it.
faulthandler_timeout = 900

# Coverage is SURFACED in CI (job summary + artifact + a badge-ready number), never
# hard-gated — a % threshold flakes as the heavy/endpoint Providers (whose real backends
# are monkeypatched, not executed) drag the number. This config only shapes what the
# number MEANS: measure the packages' src, omit tests/conftest and the vendored ULTRA
# subset so it reflects framework source coverage. It is inert unless `--cov` is passed
# (CI does; scripts/verify-local.sh runs a plain `pytest` and is unaffected).
[tool.coverage.run]
branch = true
relative_files = true
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/_vendor/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
