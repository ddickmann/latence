# deploy/qdrant/docker-compose.yml — the serving-path vector store, reproducibly (ticket
# wayfinder-enterprise-serving/02).
#
#   cd deploy/qdrant
#   docker compose up -d          # brings up a single-node Qdrant on :6333 (HTTP) / :6334 (gRPC)
#   curl -s http://localhost:6333/readyz   # "all shards are ready" once it is up
#
# What it stands up:
#   * qdrant — the ANN engine the production dense lane serves through. The framework's two
#     shipped halves meet on it: `latence-sink-qdrant` loads an Export into a collection
#     (payload columns verbatim — including the denormalised KG columns the Expander/Packer
#     read), and `latence_retrieval.QdrantBackend` reads that exact collection back as the
#     first-stage dense engine of `GraphRescueRetrieval`.
#
# Load a real Export into it (the S3 exports name the corpus table `corpus.parquet`, hence
# --basename):
#
#   .venv/bin/latence-sink-qdrant load \
#       --export benchmark/sota-campaign/stages/s3-pipeline/exports/wiki2multihop/export \
#       --collection wiki2multihop --basename corpus --url http://localhost:6333
#
# Licensing (ADR-0012, verified 2026-08-12 — code only; a vector store ships no model weights):
# the qdrant/qdrant engine is Apache-2.0 (https://github.com/qdrant/qdrant/blob/master/LICENSE);
# the qdrant-client driver is Apache-2.0 (PyPI metadata `License: Apache-2.0`, 1.19.0).
#
# Pinned (never `latest`) for a reproducible serving stack; the tag matches the qdrant-client
# major/minor the parity run was validated against. Bump deliberately, and re-run the live smoke
# (`LATENCE_QDRANT_URL=http://localhost:6333 pytest packages/latence-sink-qdrant -k live`) plus
# the serving parity harness (benchmark/serving/) when you do.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"    # HTTP API (the sink + backend default transport)
      - "6334:6334"    # gRPC (opt-in via prefer_grpc)
    volumes:
      # Persist collections across restarts; `docker compose down -v` wipes them.
      - qdrant-storage:/qdrant/storage
    healthcheck:
      # /readyz returns 200 once every shard is ready to serve.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  qdrant-storage:
