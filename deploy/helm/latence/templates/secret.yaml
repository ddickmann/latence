{{- if .Values.secrets.create }}
# QUICK-START ONLY. In production set secrets.create=false and secrets.existingSecret to a Secret
# your secret manager projects (Vault Agent / External Secrets Operator / a cloud CSI driver) — see
# docs/secrets.md. Real endpoint keys must NEVER be committed to values.yaml or a chart.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "latence.fullname" . }}-endpoint-keys
  labels:
    {{- include "latence.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
