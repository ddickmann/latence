# Default values for the latence chart. Override with `-f my-values.yaml` or `--set`.
# Every value is documented in docs/deployment.md.

# --- The pipeline image (deploy/Dockerfile) -----------------------------------------------
image:
  repository: latence
  tag: prod
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# --- The pipeline run (Job / CronJob) -----------------------------------------------------
pipeline:
  # "job" runs once (a one-shot ingest); "cronjob" runs on a schedule (incremental re-runs).
  kind: job                      # job | cronjob
  # The stack YAML the pipeline runs. Rendered verbatim into a ConfigMap (see configmap-stack).
  # Defaults to the served-OCR stack; base_url below is injected so it points at the in-cluster
  # vLLM Service regardless of what the file says.
  runId: run-0001
  # CronJob-only: the schedule + concurrency policy for recurring incremental runs.
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid      # never overlap two pipeline runs (the runner is WIP=1)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 1                # a failed run is resumable; do not thrash
  restartPolicy: Never
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Extra env for the pipeline pod (e.g. observability — see `metrics` below).
  extraEnv: []

# The stack YAML rendered into a ConfigMap and mounted at /etc/latence/stack.yaml. This is the
# deploy/stacks/served-ocr.yaml content; `stack.ocrBaseUrl` is stitched in so the Parse stage
# always targets the in-cluster vLLM OCR Service.
stack:
  # If set, the Parse stage's base_url is forced to this; leave empty to use the chart-computed
  # in-cluster URL (http://<release>-vllm-ocr:<port>/v1).
  ocrBaseUrl: ""
  storageUri: "file:///data/out"
  corpusPath: "/data/corpus"
  # The full stack YAML. Edit here (or supply your own via --set-file stack.yaml=...) to change
  # the pipeline. {{ ... }} placeholders are filled by the chart.
  yaml: |
    name: latence-served-ocr
    storage_uri: "{{ .storageUri }}"
    stages:
      - name: source
        capability: source
        provider: source.local_folder
        config:
          path: "{{ .corpusPath }}"
          sensitivity: internal
          extensions: [pdf, png, jpg, jpeg, tiff, tif, webp, bmp]
      - name: intake_screen
        capability: intake_screening
        provider: screening.intake_signature
        depends_on: [source]
        config: {max_bytes: 8388608, max_zip_ratio: 50.0}
      - name: parse
        capability: parse
        provider: parser.lighton_vllm
        depends_on: [intake_screen]
        config:
          base_url: "{{ .ocrBaseUrl }}"
          max_concurrency: 8
          dpi: 200
      - name: chunk
        capability: chunk
        provider: chunk.markdown
        depends_on: [parse]
        config: {max_tokens: 256, overlap_tokens: 32, min_tokens: 8}
      - name: content_screen
        capability: content_screening
        provider: screening.content_keyword
        depends_on: [chunk]
      - name: export_corpus
        capability: export
        provider: export.jsonl_parquet
        depends_on: [content_screen]
        config: {basename: corpus}

# --- The served vLLM OCR service (LightOn-OCR-2), the SOTA pipeline's dependency -----------
vllmOcr:
  enabled: true
  image:
    repository: vllm/vllm-openai
    tag: v0.11.0
    pullPolicy: IfNotPresent
  model: lightonai/LightOnOCR-2-1B          # Apache-2.0 weights AND code (ADR-0012)
  port: 8000
  # The vLLM serve args (LightOn's official recipe). Add "--enforce-eager" on Blackwell (SM 12.x)
  # where FlashInfer cannot JIT cudagraphs — see docs/deployment.md.
  extraArgs:
    - "--dtype=bfloat16"
    - "--gpu-memory-utilization=0.90"
    - "--max-model-len=10000"
    - "--limit-mm-per-prompt={\"image\": 1}"
    - "--mm-processor-cache-gb=0"
    - "--no-enable-prefix-caching"
    - "--max-num-seqs=32"
  # GPU scheduling: a nodeSelector + tolerations so the OCR pod lands on a GPU node only.
  gpu:
    count: 1
    nodeSelector:
      # Typical GPU-node label; change to match your cluster (e.g. cloud.google.com/gke-accelerator).
      nvidia.com/gpu.present: "true"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
  resources:
    requests:
      cpu: "4"
      memory: 24Gi
    limits:
      nvidia.com/gpu: 1
      memory: 48Gi
  affinity: {}

# --- The OPTIONAL served LLM service (endpoint LLM Providers). Off by default. -------------
vllmLlm:
  enabled: false
  image:
    repository: vllm/vllm-openai
    tag: v0.11.0
    pullPolicy: IfNotPresent
  model: Qwen/Qwen2.5-7B-Instruct
  port: 8000
  extraArgs:
    - "--dtype=bfloat16"
    - "--gpu-memory-utilization=0.85"
    - "--max-model-len=8192"
  gpu:
    count: 1
    nodeSelector:
      nvidia.com/gpu.present: "true"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
  resources:
    requests:
      cpu: "4"
      memory: 24Gi
    limits:
      nvidia.com/gpu: 1
      memory: 48Gi
  affinity: {}

# --- Secrets: env-only, REFERENCED not embedded (ADR-0012, docs/secrets.md) ----------------
secrets:
  # If create=true the chart makes a Secret from `data` (base64-less stringData) — for a quick
  # start ONLY. In production leave create=false and point `existingSecret` at a Secret your
  # secret manager (Vault Agent / External Secrets / cloud CSI) projects. Keys are consumed as env.
  create: false
  existingSecret: ""              # e.g. "latence-endpoint-keys" managed by your secret manager
  # OPENAI_API_KEY etc. A local vLLM accepts any placeholder ("EMPTY").
  data: {}                        # {OPENAI_API_KEY: "EMPTY"} — quick-start only, never real keys in git

# --- Persistent storage: corpus/output + the HF model cache -------------------------------
persistence:
  # The corpus (input) + output (RAG corpus, KG, Quality Report) volume, mounted at /data.
  data:
    enabled: true
    existingClaim: ""            # bring your own PVC (e.g. an NFS/RWX claim the corpus is staged into)
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi
  # The HF model cache the vLLM servers share (pre-cache here for air-gapped runs — docs/deployment).
  hfCache:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce    # ReadWriteMany if OCR + LLM share one cache across nodes
    size: 100Gi

# --- Observability (ADR-0047): turn the metrics seam on for the pipeline pod ---------------
metrics:
  # "none" | "prometheus" | "otel". Sets LATENCE_METRICS on the pipeline pod. The image already
  # carries the observability extra; a batch run writes Prometheus to the textfile path below (for
  # the node-exporter textfile collector) — see docs/observability.md.
  kind: none
  textfilePath: "/data/out/metrics/latence.prom"

# The uid the non-root image runs as; the PVCs must be writable by this fsGroup.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
