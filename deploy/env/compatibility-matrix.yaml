# --- The one documented full-stack end-to-end verification ------------------------------------
full_stack_run:
  status: UNVERIFIED
  command: >-
    LATENCE_OCR_BASE_URL=http://<host>:8000 bash deploy/env/full-stack/verify-full-stack.sh
    --corpus <a small directory of scanned pages> --record
  script: deploy/env/full-stack/verify-full-stack.sh
  stack: deploy/env/full-stack/stack.yaml
  artifacts:
    - _latence/runs/full-stack-0001/quality-report.json
    - _latence/runs/full-stack-0001/quality-report.md
    - _latence/runs/full-stack-0001/export/corpus.jsonl
    - _latence/runs/full-stack-0001/export/corpus.parquet
    - _latence/runs/full-stack-0001/export/graph-nodes.parquet
    - _latence/runs/full-stack-0001/export/graph-edges.parquet
  blocked_by: >-
    NOT YET RUN. It needs a Blackwell (sm_120) / CUDA-13 host with both pinned environments
    installed and the OCR server running — none of which exists on the authoring host. Everything
    the run needs is committed and one command away: the composed stack, the four gates and the
    artifact assertions (which FAIL on a skipped Stage, a Stage that resolved to cpu, an empty
    export or document_count=0, so the run cannot pass by narrowing itself). `--record` prints the
    evidence block to paste back here, so the measurement is transcribed by the machine that made
    it. Until then `latence env matrix ... --require-verified` stays red, on purpose.
