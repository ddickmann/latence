# deploy/env/compatibility-matrix.yaml — the Blackwell / CUDA-13 compatibility matrix (issue #199).
#
# THE SINGLE SOURCE OF TRUTH. `docs/compatibility-matrix.md` is GENERATED from this file
# (`latence env matrix deploy/env/compatibility-matrix.yaml --render`) and byte-compared by the
# verifier, so the published page can never drift from the checked data.
#
# THE ONE RULE: every cell is a MEASUREMENT or explicitly `UNVERIFIED`. There is no third status,
# and the verifier enforces both halves — a `verified` cell without date/hardware/command/observed
# is E-MATRIX-EVIDENCE-MISSING, and an `UNVERIFIED` cell without a runnable reproduce command is
# E-MATRIX-REPRODUCE-MISSING. Coverage is DERIVED from the committed deploy/env/*/environment.yaml
# specs, so a new enforced boundary or learned Provider turns this file red until it is mapped.
#
# TWO AXES per cell, because they fail differently and independently:
#   resolution — does the combination INSTALL from the pinned environment? Offline, import-free,
#                machine-checked on every commit by `latence env verify`.
#   runtime    — does it RUN on Blackwell sm_120? Needs the hardware. A green resolution is not a
#                runtime claim, and this file refuses to let one be read as the other.
#
# HONESTY NOTE, stated once and reflected in every cell below: the pinned environments of #195,
# #196 and #198 were authored offline. The live 2026-07-17 Blackwell/CUDA-13 run predates them and
# ran at DIFFERENT versions (torch 2.8+cu128 -> 2.11+cu130 on the serving side). So the failure
# MODES below carry real measurements from that run, while the runtime axis of every cell is
# UNVERIFIED against the pins, with the exact command that turns it into a measurement. Nothing
# here is inferred from "it should work".
#
# Governing: ADR-0016 (per-Provider packages carry the heavy deps), ADR-0036 (device profiles —
# never fabricate a device fact), ADR-0030 (the endpoint seam that resolves the transformers
# split), ADR-0012 (weights and code licences verified separately).
name: blackwell-cuda13
summary: >-
  Which learned Provider and which serving dependency of the enterprise-sota multilingual stack is
  known-good on which CUDA / torch / transformers combination on Blackwell (sm_120) — and, with
  equal weight, which combination nobody has measured yet.
hardware: >-
  Linux x86-64, NVIDIA Blackwell (compute capability 12.0, `sm_120`), CUDA-13
  driver. The live run this matrix records was on such a pod; the field report does not record the
  exact SKU, so the SKU is deliberately not stated here rather than guessed. (A related 2026-07-14
  run on an RTX PRO 4500 Blackwell / torch 2.8+cu128 is recorded in ADR-0036 §W9-scaling.)
verified_on: "2026-07-17"
doc_path: docs/compatibility-matrix.md

