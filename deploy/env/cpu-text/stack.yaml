# deploy/env/cpu-text/stack.yaml — the tiny end-to-end slice smoke.sh drives (issue #195).
#
# Deliberately the SMALLEST stack that touches every heavy leg of the CPU/text environment, so a
# broken environment fails fast and cheaply:
#
#   parse (pdfplumber) -> chunk -> GLiNER2 fused entity+relation -> learned GLiNER PII redaction
#   -> disambiguation -> graph -> KG export + RAG corpus export with BOTH the dense Granite r2
#      embedding leg AND the SPLADE sparse leg
#
# Every learned Stage pins `device: cpu` — this environment installs CPU-only torch wheels, so
# `auto` would be honest but silent; `cpu` states the intent the environment was solved for.
#
# NOT here: `disambiguation.glinker`. It is INSTALLED and REGISTERED by this environment (smoke.sh
# asserts that, and its transformers<5 cap is the binding constraint of the whole lock), but its
# ProviderProfile is compute="gpu" — on a CPU host the Runner skips it with a flag rather than
# faking it. Its runtime slice belongs to the GPU environment (#198). The CPU-real
# `disambiguation.embedding` carries this stage here.
#
# `{STORAGE_URI}` / `{CORPUS_DIR}` are filled by the harness (`latence stack validate`).
name: latence-cpu-text-env-smoke
storage_uri: "{STORAGE_URI}"
stages:
  - name: source
    capability: source
    provider: source.local_folder
    config:
      path: "{CORPUS_DIR}"
      sensitivity: internal
      extensions: [txt, md, markdown, pdf, zip]

  - name: intake_screen
    capability: intake_screening
    provider: screening.intake_signature
    depends_on: [source]
    config:
      max_bytes: 2097152
      max_zip_ratio: 50.0

  - name: parse
    capability: parse
    provider: parser.pdfplumber
    depends_on: [intake_screen]

  - name: chunk
    capability: chunk
    provider: chunk.markdown
    depends_on: [parse]
    # 640 chunker-tokens is the calibrated safe near-max for the gliner family's 768-token
    # mdeberta-v3 window (see stacks/gpu-sota-pod.yaml for the pod measurement).
    config: {max_tokens: 640, overlap_tokens: 80, min_tokens: 8}

  - name: content_screen
    capability: content_screening
    provider: screening.content_keyword
    depends_on: [chunk]

  - name: extract
    capability: fused_entity_relation
    provider: fused_entity_relation.gliner2
    depends_on: [content_screen]
    config:
      device: cpu
      labels: [organization, person]
      relation_labels: [works for, partner of]
      threshold: 0.3

  - name: redact
    capability: redaction
    provider: redaction.gliner_pii
    depends_on: [content_screen]
    config:
      device: cpu
      pii_labels: [person, email, phone number, address]

  - name: profiling
    capability: profiling
    provider: profiling.statistical
    depends_on: [parse, extract]

  - name: disambiguate
    capability: disambiguation
    provider: disambiguation.embedding
    depends_on: [extract]
    config:
      threshold: 0.90
      context_window: 160
      embedder:
        provider: embedding.sentence_transformers
        # CPU tier of the blessed Granite r2 default (ADR-0045): the 97m multilingual checkpoint,
        # Apache-2.0 weights (IBM) over the Apache-2.0 sentence-transformers code path.
        config: {model: ibm-granite/granite-embedding-97m-multilingual-r2, dimension: 384, device: cpu}
      kb:
        - {kb_id: Q1, name: Acme, entity_type: organization}
        - {kb_id: Q2, name: International Business Machines, entity_type: organization, aliases: [IBM]}
      kb_threshold: 0.5

  - name: graph
    capability: graph_assembly
    provider: graph.canonical
    depends_on: [disambiguate]
    config: {corpus_id: latence-cpu-text-env-smoke}

  - name: export_kg
    capability: export
    provider: export.knowledge_graph
    depends_on: [graph]
    config: {basename: graph}

  - name: export_corpus
    capability: export
    provider: export.jsonl_parquet
    depends_on: [redact]
    config:
      basename: corpus
      embedder:
        provider: embedding.sentence_transformers
        config: {model: ibm-granite/granite-embedding-97m-multilingual-r2, dimension: 384, device: cpu}
      # The sparse leg (ADR-0053). The checkpoint is NOT bge-m3: BAAI/bge-m3's HF config declares
      # architectures=["XLMRobertaModel"] (verified against the HF model API, 2026-07-18) — it has
      # no MLM head, so `AutoModelForMaskedLM.from_pretrained` (what TransformersSpladeModel calls)
      # would randomly initialise `lm_head` and emit a meaningless sparse vector. Its own sparse
      # weights come from FlagEmbedding's bespoke head, which this seam does not implement.
      #
      # Wired instead: opensearch-project/opensearch-neural-sparse-encoding-multilingual-v1 — a
      # genuine multilingual SPLADE MLM (architectures=["BertForMaskedLM"], ungated), WEIGHTS
      # Apache-2.0 and CODE path `transformers` Apache-2.0, both verified separately per ADR-0012
      # on 2026-07-18. naver/splade-v3 was rejected: cc-by-nc-sa-4.0 (non-commercial) and gated.
      sparse_embedder:
        provider: sparse.splade
        config:
          model: opensearch-project/opensearch-neural-sparse-encoding-multilingual-v1
          mode: inject
          max_length: 512
